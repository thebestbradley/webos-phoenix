<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music, now playing</title>
<link rel="stylesheet" href="../assets/base.css">
<script src="../assets/icons.js"></script>
<script src="../assets/app.js"></script>
<style>
  /* The player takes its scheme from the cover (.from-art); the frame keeps the wallpaper's. */
  .card { background: linear-gradient(180deg, var(--md-surface-container-high), var(--md-surface) 62%); display: flex; flex-direction: column; color: var(--md-on-surface); }
  .bar { display: flex; align-items: center; padding: 14px 10px 0; }
  .bar .mid { flex: 1; text-align: center; }
  .bar .mid .k { font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--md-on-surface-variant); }
  .bar .mid .v { font-size: 14px; line-height: 20px; font-weight: 650; }
  .art { margin: 22px 30px 0; aspect-ratio: 1; border-radius: var(--r-xl); overflow: hidden; box-shadow: 0 18px 40px -12px rgb(0 0 0 / .45), var(--e2); }
  .art svg { width: 100%; height: 100%; display: block; }
  .meta { display: flex; align-items: center; gap: 12px; padding: 32px 30px 0; }
  .meta .txt { flex: 1; min-width: 0; }
  .meta .t { font-size: 27px; line-height: 34px; font-weight: 750; letter-spacing: -.3px; }
  .meta .a { font-size: 16px; line-height: 22px; color: var(--md-on-surface-variant); margin-top: 2px; }
  .like { width: 52px; height: 52px; border-radius: var(--r-lg); background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); display: grid; place-items: center; }
  .prog { padding: 24px 30px 0; }
  .prog svg { display: block; width: 100%; height: 28px; overflow: visible; }
  .times { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--md-on-surface-variant); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ctrls { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 30px 22px 0; }
  .ctrls .sm { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--md-on-surface-variant); }
  .ctrls .md { width: 68px; height: 72px; border-radius: var(--r-xl); background: var(--md-secondary-container); color: var(--md-on-secondary-container); display: grid; place-items: center; }
  .ctrls .md .ic { width: 32px; height: 32px; }
  .ctrls .play { width: 120px; height: 84px; border-radius: var(--r-xl); background: var(--md-primary); color: var(--md-on-primary); display: grid; place-items: center; box-shadow: var(--e2); }
  .ctrls .play .ic { width: 44px; height: 44px; }
  .ctrls .sm.on { color: var(--md-primary); position: relative; }
  .ctrls .sm.on::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: var(--md-primary); }
  .tools { display: flex; align-items: center; gap: 8px; padding: 24px 22px 0; }
  .out { height: 40px; padding: 0 16px 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; background: var(--md-surface-container-highest); font-size: 14px; font-weight: 650; color: var(--md-on-surface); }
  .out .ic { width: 20px; height: 20px; color: var(--md-primary); }
  .tools .sp { flex: 1; }
  .next { margin: auto 16px 20px; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: var(--r-xl); background: var(--md-surface-container); }
  .next .mini { width: 48px; height: 48px; border-radius: var(--r-md); overflow: hidden; flex: none; background: linear-gradient(160deg, #23476b, #6aa6b8 60%, #e8d6b5); }
  .next .k { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .5px; color: var(--md-primary); text-transform: uppercase; }
  .next .v { font-size: 15px; line-height: 20px; font-weight: 600; }
  .next .txt { flex: 1; }
</style>
</head>
<body>
<div class="device" data-app="Music">
  <main class="card from-art">
    <div class="bar">
      <div class="icon-btn"><i data-i="keyboard_arrow_down"></i></div>
      <div class="mid"><div class="k">Playing from album</div><div class="v">Quiet Harbors</div></div>
      <div class="icon-btn"><i data-i="more_vert"></i></div>
    </div>
    <div class="art">
      <!-- Cover art drawn for this mock: sunset over a harbour, original -->
      <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2550"/><stop offset=".45" stop-color="#7a3f6e"/><stop offset=".72" stop-color="#e2725b"/><stop offset="1" stop-color="#f6c48e"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f5e"/><stop offset="1" stop-color="#121633"/></linearGradient>
          <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2b0"/><stop offset="1" stop-color="#ff9a6a"/></linearGradient>
        </defs>
        <rect width="400" height="400" fill="url(#sky)"/>
        <circle cx="200" cy="246" r="92" fill="url(#sun)"/>
        <clipPath id="sunclip"><circle cx="200" cy="246" r="92"/></clipPath>
        <g fill="#b0587a" clip-path="url(#sunclip)"><rect x="100" y="204" width="200" height="4"/><rect x="100" y="219" width="200" height="6"/><rect x="100" y="236" width="200" height="8"/><rect x="100" y="254" width="200" height="10"/></g>
        <path d="M0 268 C60 258 110 276 170 266 S290 254 400 266 V400 H0Z" fill="url(#sea)"/>
        <path d="M0 300 C70 290 130 308 200 298 S330 288 400 298" stroke="#e2725b" stroke-opacity=".5" stroke-width="3" fill="none"/>
        <path d="M30 330 C90 322 150 338 220 330 S330 322 380 330" stroke="#f6c48e" stroke-opacity=".35" stroke-width="2.5" fill="none"/>
        <path d="M60 358 C120 352 180 364 240 358 S330 352 360 358" stroke="#f6c48e" stroke-opacity=".22" stroke-width="2" fill="none"/>
        <g fill="#121633"><path d="M292 262 l0 -62 l30 58 z"/><path d="M288 262 l0 -48 l-22 48 z"/><path d="M258 266 h72 l-10 11 h-52 z"/></g>
        <circle cx="70" cy="70" r="1.6" fill="#fff" opacity=".8"/><circle cx="320" cy="48" r="1.2" fill="#fff" opacity=".7"/><circle cx="350" cy="110" r="1.4" fill="#fff" opacity=".6"/><circle cx="130" cy="34" r="1" fill="#fff" opacity=".7"/>
      </svg>
    </div>
    <div class="meta">
      <div class="txt"><div class="t">Harbour Lights</div><div class="a">Lumen Field · Quiet Harbors</div></div>
      <div class="like"><i data-i="favorite-fill"></i></div>
    </div>
    <div class="prog">
      <svg viewBox="0 0 386 28">
        <path id="wave" fill="none" stroke="var(--md-primary)" stroke-width="5" stroke-linecap="round" d=""/>
        <line x1="150" y1="14" x2="383" y2="14" stroke="var(--md-secondary-container)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="383" cy="14" r="2" fill="var(--md-on-secondary-container)"/>
        <rect x="139" y="0" width="5" height="28" rx="2.5" fill="var(--md-primary)"/>
      </svg>
      <div class="times"><span>1:24</span><span>3:52</span></div>
    </div>
    <div class="ctrls">
      <div class="sm on"><i data-i="shuffle"></i></div>
      <div class="md"><i data-i="skip_previous-fill"></i></div>
      <div class="play"><i data-i="pause-fill"></i></div>
      <div class="md"><i data-i="skip_next-fill"></i></div>
      <div class="sm"><i data-i="repeat"></i></div>
    </div>
    <div class="tools">
      <div class="out"><i data-i="headphones-fill"></i>Kai’s headphones</div>
      <div class="sp"></div>
      <div class="icon-btn"><i data-i="lyrics-fill"></i></div>
      <div class="icon-btn"><i data-i="queue_music-fill"></i></div>
    </div>
    <div class="next">
      <div class="mini"></div>
      <div class="txt"><div class="k">Up next</div><div class="v">Glass Tides · Lumen Field</div></div>
      <div class="icon-btn"><i data-i="drag_indicator"></i></div>
    </div>
  </main>
</div>
<script>
  // The M3 Expressive wavy progress: a sine along the played part.
  let d = 'M3 14';
  for (let x = 3; x <= 132; x += 1) d += ` L${x} ${14 + 4.5 * Math.sin((x - 3) / 6.5)}`;
  document.getElementById('wave').setAttribute('d', d);
</script>
</body>
</html>
