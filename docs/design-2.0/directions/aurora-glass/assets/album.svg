<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- "Night Transit" by The Lumen Pilots: invented cover art, drawn for these mock-ups. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140C3A"/>
      <stop offset=".55" stop-color="#2B1660"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36E"/>
      <stop offset=".45" stop-color="#FF6F91"/>
      <stop offset="1" stop-color="#8E5BFF"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3EE6AE" stop-opacity="0"/>
      <stop offset=".6" stop-color="#3EE6AE"/>
      <stop offset="1" stop-color="#E9FFF7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#FF6F91" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF6F91" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="300" cy="280" r="150"/></clipPath>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="80" cy="70" r="1.6"/><circle cx="150" cy="140" r="1.1"/><circle cx="510" cy="90" r="1.8"/>
    <circle cx="460" cy="170" r="1.1"/><circle cx="60" cy="230" r="1.2"/><circle cx="540" cy="250" r="1.3"/>
    <circle cx="230" cy="60" r="1"/><circle cx="380" cy="40" r="1.4"/>
  </g>
  <circle cx="300" cy="300" r="260" fill="url(#glow)"/>
  <g clip-path="url(#disc)">
    <rect x="150" y="130" width="300" height="300" fill="url(#sun)"/>
    <g fill="#1d1250">
      <rect x="150" y="300" width="300" height="6"/>
      <rect x="150" y="324" width="300" height="9"/>
      <rect x="150" y="350" width="300" height="12"/>
      <rect x="150" y="378" width="300" height="16"/>
      <rect x="150" y="408" width="300" height="30"/>
    </g>
  </g>
  <path d="M0 448 L600 430 L600 600 L0 600 Z" fill="#081428"/>
  <path d="M0 448 L600 430" stroke="#2CC7D9" stroke-opacity=".5" stroke-width="2"/>
  <rect x="40" y="462" width="420" height="5" rx="2.5" fill="url(#streak)"/>
  <rect x="130" y="478" width="300" height="3" rx="1.5" fill="url(#streak)" opacity=".6"/>
</svg>
