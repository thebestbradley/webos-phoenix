<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music, now playing</title>
<link rel="stylesheet" href="../assets/base.css">
<script src="../assets/icons.js"></script>
<script src="../assets/app.js"></script>
<style>
  .card { display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; padding: 16px 16px 0; }
  .bar .mid { flex: 1; text-align: center; }
  .stage { position: relative; margin: 26px 38px 0; aspect-ratio: 1; }
  /* depth by light: the cover lights the space under it (a blurred copy; pre-blurred image on low-end GPUs) */
  .stage .glow { position: absolute; inset: 6% -5% -7% -5%; filter: blur(42px) saturate(1.7) brightness(1.5); opacity: .5; border-radius: 40px; overflow: hidden; }
  html[data-theme="dark"] .stage .glow { opacity: .62; }
  .stage .glow svg, .stage .art svg { width: 100%; height: 100%; display: block; }
  .stage .art { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; box-shadow: 0 0 0 var(--hair) rgb(255 255 255 / .25) inset, 0 30px 50px -30px rgb(0 0 0 / .6); }
  .stage .art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(155deg, rgb(255 255 255 / .22), rgb(255 255 255 / 0) 38%); box-shadow: inset 0 1px 0 rgb(255 255 255 / .35); }
  .meta { padding: 40px 34px 0; display: flex; align-items: flex-end; gap: 12px; }
  .meta .txt { flex: 1; }
  .meta .title-xl { font-weight: 300; }
  .prog { padding: 26px 34px 0; }
  .prog .slider { height: 22px; }
  .prog .slider .track { top: 10.5px; }
  .prog .slider .fill { top: 10px; width: 36%; }
  .prog .head { position: absolute; left: 36%; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgb(255 120 40 / .35), 0 0 14px 3px rgb(255 120 40 / .6); }
  .times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
  .ctrls { display: flex; align-items: center; justify-content: space-between; padding: 26px 36px 0; }
  .ctrls .ic { width: 30px; height: 30px; color: var(--ink); }
  .ctrls .sm .ic { width: 22px; height: 22px; color: var(--ink-2); }
  .ctrls .sm.on .ic { color: var(--ink); }
  .ctrls .sm.on { position: relative; } .ctrls .sm.on::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 6px var(--ember-a); }
  .play { width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center; background: var(--inverse); box-shadow: 0 14px 30px -12px rgb(0 0 0 / .55), inset 0 1px 0 rgb(255 255 255 / .18); }
  .play .ic { width: 32px !important; height: 32px !important; color: var(--on-inverse) !important; }
  .vol { display: flex; align-items: center; gap: 14px; padding: 30px 36px 0; color: var(--ink-3); }
  .vol .ic { width: 18px; height: 18px; }
  .vol .slider { flex: 1; }
  .vol .slider .fill { width: 62%; background: var(--ink-2); box-shadow: none; }
  .vol .slider .knob { left: 62%; }
  .vol .slider .knob::after { background: var(--ink-2); }
  .tools { display: flex; align-items: center; gap: 10px; padding: 0 22px 18px; }
  .out { height: 40px; padding: 0 16px 0 12px; border-radius: 20px; display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; box-shadow: inset 0 0 0 var(--hair) var(--line-2); }
  .out .ic { width: 18px; height: 18px; }
  .tools .sp { flex: 1; }
  .next { margin: auto 36px 18px; padding-top: 14px; display: flex; align-items: baseline; gap: 10px; box-shadow: inset 0 var(--hair) 0 var(--line-2); }
  .next .nt { font-size: 14.5px; font-weight: 600; }
</style>
</head>
<body>
<div class="device" data-app="Music">
  <main class="card">
    <div class="bar">
      <div class="ring-btn bare"><i data-i="caret-down"></i></div>
      <div class="mid"><div class="micro dimmer">Playing from album</div><div class="small" style="font-weight:600;margin-top:2px">Quiet Harbors</div></div>
      <div class="ring-btn bare"><i data-i="dots-three"></i></div>
    </div>
    <div class="stage">
      <div class="glow" id="glow"></div>
      <div class="art" id="art">
        <!-- Cover art drawn for this mock: sunset over a harbour, original -->
        <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2550"/><stop offset=".45" stop-color="#7a3f6e"/><stop offset=".72" stop-color="#e2725b"/><stop offset="1" stop-color="#f6c48e"/></linearGradient>
            <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f5e"/><stop offset="1" stop-color="#121633"/></linearGradient>
            <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2b0"/><stop offset="1" stop-color="#ff9a6a"/></linearGradient>
            <clipPath id="sunclip"><circle cx="200" cy="246" r="92"/></clipPath>
          </defs>
          <rect width="400" height="400" fill="url(#sky)"/>
          <circle cx="200" cy="246" r="92" fill="url(#sun)"/>
          <g fill="#b0587a" clip-path="url(#sunclip)"><rect x="100" y="204" width="200" height="4"/><rect x="100" y="219" width="200" height="6"/><rect x="100" y="236" width="200" height="8"/><rect x="100" y="254" width="200" height="10"/></g>
          <path d="M0 268 C60 258 110 276 170 266 S290 254 400 266 V400 H0Z" fill="url(#sea)"/>
          <path d="M0 300 C70 290 130 308 200 298 S330 288 400 298" stroke="#e2725b" stroke-opacity=".5" stroke-width="3" fill="none"/>
          <path d="M30 330 C90 322 150 338 220 330 S330 322 380 330" stroke="#f6c48e" stroke-opacity=".35" stroke-width="2.5" fill="none"/>
          <path d="M60 358 C120 352 180 364 240 358 S330 352 360 358" stroke="#f6c48e" stroke-opacity=".22" stroke-width="2" fill="none"/>
          <g fill="#121633"><path d="M292 262 l0 -62 l30 58 z"/><path d="M288 262 l0 -48 l-22 48 z"/><path d="M258 266 h72 l-10 11 h-52 z"/></g>
          <circle cx="70" cy="70" r="1.6" fill="#fff" opacity=".8"/><circle cx="320" cy="48" r="1.2" fill="#fff" opacity=".7"/><circle cx="350" cy="110" r="1.4" fill="#fff" opacity=".6"/><circle cx="130" cy="34" r="1" fill="#fff" opacity=".7"/>
        </svg>
      </div>
    </div>
    <div class="meta">
      <div class="txt"><div class="title-xl">Harbour Lights</div><div class="body dim" style="margin-top:4px">Lumen Field · Quiet Harbors</div></div>
      <div class="ring-btn"><i data-i="heart-fill" style="color:var(--ink)"></i></div>
    </div>
    <div class="prog">
      <div class="slider"><div class="track"></div><div class="fill"></div><div class="head"></div></div>
      <div class="times"><span>1:24</span><span>−2:28</span></div>
    </div>
    <div class="ctrls">
      <div class="sm on"><i data-i="shuffle"></i></div>
      <i data-i="skip-back-fill"></i>
      <div class="play"><i data-i="pause-fill"></i></div>
      <i data-i="skip-forward-fill"></i>
      <div class="sm"><i data-i="repeat"></i></div>
    </div>
    <div class="vol"><i data-i="speaker-high"></i><div class="slider"><div class="track"></div><div class="fill"></div><div class="knob"></div></div></div>
    <div class="next"><span class="micro dimmer">Up next</span><span class="nt">Glass Tides</span><span class="small dim">Lumen Field</span><span class="small dimmer" style="margin-left:auto">3:48</span></div>
    <div class="tools">
      <div class="out"><i data-i="headphones"></i>Kai’s headphones</div>
      <div class="sp"></div>
      <div class="ring-btn bare"><i data-i="chat-circle-dots"></i></div>
      <div class="ring-btn bare"><i data-i="queue"></i></div>
    </div>
  </main>
</div>
<script>document.getElementById('glow').innerHTML = document.getElementById('art').innerHTML.replace(/id="(\w+)"/g, 'id="g$1"').replace(/url\(#(\w+)\)/g, 'url(#g$1)');</script>
</body>
</html>
