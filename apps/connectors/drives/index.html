     org.webosphoenix.drives is not in the launcher: it carries the drive
     accounts (templates in public/accounts, the sign-in page
     accounts/wizard.html, the service in service/). Opened anyway (a
     search result, a link), it says where the drives are and opens Files
     at them. -->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drives</title>
    <style>
        body { font-family: "Prelude", sans-serif; margin: 0; background: #f3f1ec; color: #333; }
        header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #e6e2d8; border-bottom: 1px solid #cfc9bb; }
        h1 { font-size: 20px; margin: 0; font-weight: normal; }
        p { margin: 16px; line-height: 1.4; }
        button { margin: 0 16px; padding: 10px 18px; font-size: 16px; border-radius: 8px; border: 1px solid #8a8a8a; background: #fff; }
    </style>
</head>
<body>
    <header><img src="icon.png" width="32" height="32" alt=""><h1>Drives</h1></header>
    <p>Your drives (Nextcloud, WebDAV, S3 storage, Dropbox, OneDrive, Google Drive, Box) are places in Files, the file pickers and Save to Files.
       Add one in Accounts.</p>
    <button id="files" type="button">Open Files</button>
    <script>
        document.getElementById("files").onclick = function () {
            var b = new PalmServiceBridge();
            b.call("luna://com.webos.applicationManager/launch", JSON.stringify({ id: "org.webosphoenix.files", params: { path: "/media/drives" } }));
        };
    </script>
</body>
</html>
