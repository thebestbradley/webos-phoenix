name: flutter_notes
description: "Notes (Flutter): the Notes demo in Flutter"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.3
  markdown: ^7.3.1
  # The Phoenix service plugin for Dart (apps/shared/phoenix_services).
  phoenix_services:
    path: ../shared/phoenix_services
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Bundled, so the web build draws text without fetching Roboto from
  # Google's font CDN (a device may be offline). README.md, docs/LEGAL.md.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/roboto/Roboto-Regular.ttf
        - asset: fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/roboto/Roboto-Bold.ttf
          weight: 700
    - family: DejaVu Sans Mono
      fonts:
        - asset: fonts/dejavu/DejaVuSansMono.ttf
        - asset: fonts/dejavu/DejaVuSansMono-Bold.ttf
          weight: 700
