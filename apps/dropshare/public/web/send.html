     DropShare's page for another device (docs/APP-RUNTIME.md "DropShare"):
     the device serves it at its one-time address; any browser on the same
     network lists the files the device offers (GET files) and downloads
     them (GET file/N). Once each was downloaded the session ends. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>From webOS Phoenix</title>
<style>
  body { margin: 0; font: 16px/1.4 "Prelude", "Open Sans", system-ui, sans-serif; background: #e6e6e6; color: #222; }
  header { background: linear-gradient(#4a4a4a, #2b2b2b); color: #fff; padding: 14px 18px; font-size: 20px; }
  main { max-width: 560px; margin: 0 auto; padding: 18px; }
  .card { background: #fff; border-radius: 10px; border: 1px solid #b5b5b5; padding: 6px 16px; margin-bottom: 14px; }
  a.file { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid #ddd;
           color: #1f5fa8; text-decoration: none; font-weight: bold; }
  a.file:first-child { border-top: 0; }
  a.file span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .size { color: #666; font-weight: normal; white-space: nowrap; }
  .note { color: #666; font-size: 14px; }
</style>
</head>
<body>
<header>From webOS Phoenix</header>
<main>
  <div class="card" id="list"><p class="note">Loading…</p></div>
  <p class="note">Tap a file to download it. This address works once: it stops when every file was downloaded.</p>
</main>
<script>
(function () {
  "use strict";
  function size(n) { return n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  var list = document.getElementById("list");
  var x = new XMLHttpRequest();
  x.open("GET", "files");
  x.onload = function () {
    var files = [];
    try { files = JSON.parse(x.responseText).files || []; } catch (e) { files = []; }
    list.innerHTML = "";
    if (!files.length) { list.innerHTML = "<p class=\"note\">Nothing here any more.</p>"; return; }
    files.forEach(function (f) {
      var a = document.createElement("a"), n = document.createElement("span"), s = document.createElement("span");
      a.className = "file"; a.href = "file/" + f.id; a.setAttribute("download", f.name);
      n.textContent = f.name; s.className = "size"; s.textContent = size(f.size);
      a.appendChild(n); a.appendChild(s); list.appendChild(a);
    });
  };
  x.onerror = function () { list.innerHTML = "<p class=\"note\">The device is not sharing any more.</p>"; };
  x.send();
})();
</script>
</body>
</html>
