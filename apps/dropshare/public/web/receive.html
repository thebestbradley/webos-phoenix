<!doctype html>
<!-- Copyright (c) 2026 webOS Phoenix contributors. SPDX-License-Identifier: Apache-2.0
     DropShare's page for another device (docs/APP-RUNTIME.md "DropShare"):
     the device serves it at its one-time address; any browser on the same
     network picks files and sends them, one request each
     (POST upload?name=&type=, the file the body), then says it is done
     (POST done), which ends the session. No scripts or styles from
     anywhere else: the page stands alone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Send to webOS Phoenix</title>
<style>
  body { margin: 0; font: 16px/1.4 "Prelude", "Open Sans", system-ui, sans-serif; background: #e6e6e6; color: #222; }
  header { background: linear-gradient(#4a4a4a, #2b2b2b); color: #fff; padding: 14px 18px; font-size: 20px; }
  main { max-width: 560px; margin: 0 auto; padding: 18px; }
  .card { background: #fff; border-radius: 10px; border: 1px solid #b5b5b5; padding: 16px; margin-bottom: 14px; }
  label.pick { display: block; text-align: center; padding: 14px; border-radius: 8px; color: #fff; font-weight: bold;
               background: linear-gradient(#5aa6e6, #2a74c0); border: 1px solid #1d5a99; cursor: pointer; }
  input[type=file] { display: none; }
  button { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #2f7d2a; color: #fff;
           background: linear-gradient(#7cc96a, #3f9a33); font-weight: bold; margin-top: 12px; }
  button:disabled { opacity: 0.5; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { padding: 8px 0; border-top: 1px solid #ddd; display: flex; justify-content: space-between; gap: 10px; }
  li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { color: #666; white-space: nowrap; }
  .note { color: #666; font-size: 14px; }
  .ok { color: #2f7d2a; font-weight: bold; }
  .bad { color: #b22; font-weight: bold; }
</style>
</head>
<body>
<header>Send to webOS Phoenix</header>
<main>
  <div class="card">
    <label class="pick" id="pickLabel">Choose Files<input type="file" id="pick" multiple></label>
    <ul id="list"></ul>
    <button id="send" disabled>Send</button>
    <p id="result" class="note"></p>
  </div>
  <p class="note">The files go straight to the device over this network. This address works once: it stops when they are sent.</p>
</main>
<script>
(function () {
  "use strict";
  var pick = document.getElementById("pick"), list = document.getElementById("list"), send = document.getElementById("send");
  var result = document.getElementById("result"), files = [], busy = false;
  function size(n) { return n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  function show() {
    list.innerHTML = "";
    files.forEach(function (f) {
      var li = document.createElement("li"), a = document.createElement("span"), b = document.createElement("span");
      a.textContent = f.file.name; b.className = "state"; b.textContent = f.state || size(f.file.size);
      li.appendChild(a); li.appendChild(b); list.appendChild(li);
    });
    send.disabled = busy || !files.length;
  }
  pick.addEventListener("change", function () {
    files = Array.prototype.map.call(pick.files, function (f) { return { file: f }; });
    result.textContent = ""; show();
  });
  function upload(f) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open("POST", "upload?name=" + encodeURIComponent(f.file.name) + "&type=" + encodeURIComponent(f.file.type || ""));
      x.upload.onprogress = function (e) {
        if (e.lengthComputable) { f.state = Math.floor(e.loaded * 100 / e.total) + "%"; show(); }
      };
      x.onload = function () {
        if (x.status === 200) { f.state = "Sent"; show(); resolve(); }
        else { f.state = x.status === 413 ? "Too large" : "Failed"; show(); reject(new Error(f.state)); }
      };
      x.onerror = function () { f.state = "Failed"; show(); reject(new Error("The device did not answer")); };
      x.send(f.file);
    });
  }
  send.addEventListener("click", function () {
    busy = true; show(); document.getElementById("pickLabel").style.display = "none";
    files.reduce(function (p, f) { return p.then(function () { return upload(f); }); }, Promise.resolve())
      .then(function () {
        var x = new XMLHttpRequest(); x.open("POST", "done"); x.send("");
        result.className = "ok"; result.textContent = files.length === 1 ? "Sent. It is in the device's Downloads." : "Sent. They are in the device's Downloads.";
      }, function (e) {
        result.className = "bad"; result.textContent = "Not everything was sent: " + e.message;
        busy = false; show(); document.getElementById("pickLabel").style.display = "";
      });
  });
})();
</script>
</body>
</html>
