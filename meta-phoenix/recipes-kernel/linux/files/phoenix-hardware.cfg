#
# Open source drivers for as much hardware as possible, as modules: built
# into every Phoenix image (kernel-modules, webos-phoenix-image) and loaded
# by modalias when the device is there (docs/HARDWARE.md, "Hardware support
# and the Hardware app"). Firmware that is not open source is not in the
# image; org.webosphoenix.hardware offers it (docs/LEGAL.md, "Firmware and
# drivers"). Architecture-specific drivers: phoenix-hardware-x86.cfg,
# phoenix-hardware-arm.cfg.

# Firmware the drivers ask for, compressed or not, from /lib/firmware (no
# user-space helper).
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_XZ=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
# CONFIG_FW_LOADER_USER_HELPER is not set

# USB classes: storage, serial, printers, modems, network adapters and
# phones sharing their connection
CONFIG_USB_STORAGE=m
CONFIG_USB_UAS=m
CONFIG_USB_ACM=m
CONFIG_USB_PRINTER=m
CONFIG_USB_WDM=m
CONFIG_USB_SERIAL=m
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_FTDI_SIO=m
CONFIG_USB_SERIAL_PL2303=m
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_SERIAL_OPTION=m
CONFIG_USB_SERIAL_QUALCOMM=m
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_CDC_MBIM=m
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_NET_QMI_WWAN=m
CONFIG_USB_NET_AX8817X=m
CONFIG_USB_NET_AX88179_178A=m
CONFIG_USB_NET_SMSC95XX=m
CONFIG_USB_RTL8152=m
CONFIG_USB_IPHETH=m
CONFIG_TYPEC=m

# Keyboards, mice, touchpads, pens, game controllers, sensor hubs
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_UHID=m
CONFIG_HID_MULTITOUCH=m
CONFIG_HID_APPLE=m
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_LOGITECH_HIDPP=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_SONY=m
CONFIG_HID_PLAYSTATION=m
CONFIG_HID_NINTENDO=m
CONFIG_HID_STEAM=m
CONFIG_HID_WACOM=m
CONFIG_HID_SENSOR_HUB=m
CONFIG_I2C_HID_OF=m
CONFIG_INPUT_JOYDEV=m
CONFIG_INPUT_JOYSTICK=y
CONFIG_JOYSTICK_XPAD=m
CONFIG_JOYSTICK_XPAD_FF=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=m
CONFIG_TOUCHSCREEN_EDT_FT5X06=m
CONFIG_TOUCHSCREEN_ELAN=m
CONFIG_TOUCHSCREEN_ATMEL_MXT=m
CONFIG_TOUCHSCREEN_SILEAD=m
CONFIG_TOUCHSCREEN_USB_COMPOSITE=m
CONFIG_INPUT_MISC=y
CONFIG_INPUT_UINPUT=m
CONFIG_INPUT_GPIO_VIBRA=m

# Storage: NVMe, SD cards and card readers, the file systems USB drives use
