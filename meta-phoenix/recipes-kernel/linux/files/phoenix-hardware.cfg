CONFIG_MMC_REALTEK_USB=m
CONFIG_VFAT_FS=y
CONFIG_EXFAT_FS=m
CONFIG_NTFS3_FS=m

# Wi-Fi: Atheros/Qualcomm, Intel, Realtek, MediaTek, Broadcom/Cypress,
# Marvell (most need firmware from the Hardware app; ath9k does not)
CONFIG_WLAN=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_ATH9K=m
CONFIG_ATH9K_HTC=m
CONFIG_ATH10K=m
CONFIG_ATH10K_PCI=m
CONFIG_ATH10K_SDIO=m
CONFIG_ATH10K_USB=m
CONFIG_ATH11K=m
CONFIG_ATH11K_PCI=m
CONFIG_IWLWIFI=m
CONFIG_IWLDVM=m
