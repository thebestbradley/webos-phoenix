#
# What webOS OSE and Phoenix need from a device's own kernel (the phone and
# tablet kernels of linux-phoenix-device.inc, whose base configuration is
# the device distribution's, not OSE's). All built in: merged last, these
# only ever turn an option on.
#
# From OSE's own kernel fragments (meta-webosose d7ed46c):
#   meta-webos/recipes-kernel/linux/linux-yocto/{oomd,zram,enable_uinput,crypto}.cfg
#   meta-webos-raspberrypi/recipes-kernel/linux/linux-raspberrypi/{security,ebpf,bridge}.cfg
# and what systemd (cgroup v2, autofs, fhandle), Chromium's sandbox
# (WebAppMgr: namespaces, seccomp) and Phoenix's services (phoenix-devices:
# evdev, uinput, the LED class, IIO) use.

# systemd
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_BPF=y
CONFIG_FHANDLE=y
CONFIG_AUTOFS_FS=y
CONFIG_DEVTMPFS=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# Chromium's sandbox (WebAppMgr's renderers)
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# OSE: oomd.cfg (memory pressure), zram.cfg, enable_uinput.cfg
CONFIG_PSI=y
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=y
CONFIG_INPUT_MISC=y
CONFIG_INPUT_UINPUT=y
CONFIG_INPUT_EVDEV=y

# OSE: security.cfg, ebpf.cfg (the Pi's)
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_AUDIT=y
CONFIG_BPF_SYSCALL=y

# OSE: crypto.cfg (luna-service2, db8, the keystore's user-space crypto API)
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_AEAD=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y

# connman: tethering and its NAT (bridge.cfg's essentials)
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_BRIDGE=y
CONFIG_TUN=y

# phoenix-devices (HARDWARE.md, "LunaSysMgr's device services"): the LED
# class with the transient trigger (vibrators on LEDs), force feedback, IIO
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_TRANSIENT=y
CONFIG_INPUT_FF_MEMLESS=y
CONFIG_IIO=y

# Root on ext4 without an initramfs (the boot images mount root= themselves)
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y

# A read-only root later (HARDWARE.md, OTA)
CONFIG_SQUASHFS=y
CONFIG_OVERLAY_FS=y
