# phoenix-vm-arm64 on hypervisors beyond QEMU: the A/B disk
# (files/wic/phoenix-ab-efi.wks.in, booted by UEFI firmware and GRUB) in
# VMware Fusion, Parallels, VirtualBox, Apple Virtualization (UTM's Apple
# backend, Tart, VirtualBuddy), libvirt with AAVMF, and Hyper-V on Windows
# on Arm (docs/VIRTUALIZATION.md). There is no initramfs, so
# every disk controller a target boots from, and the GPT that names the
# root, are built in. Applied after phoenix-vm.cfg; QEMU's kernel boot is
# unchanged (it keeps its device tree, and ACPI stays off where a device
# tree is given). The EFI lines repeat phoenix-rauc.cfg's on purpose: that
# one applies only with meta-rauc.

# EFI: started by GRUB or the firmware (the arm64 Image is its
# own EFI application), the GPT, and the firmware's framebuffer until the
# real display driver binds.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_PARTITION=y
CONFIG_EFIVAR_FS=m
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_SIMPLEDRM=y

# ACPI: EFI hypervisors describe their hardware with it (and Hyper-V needs
# it); its power button is UTM-less hosts' Shut Down.
CONFIG_ACPI=y
CONFIG_ACPI_BUTTON=y

# Disks: NVMe (VMware Fusion and Parallels by default), SATA (AHCI),
# Hyper-V's storvsc. virtio-blk and virtio-scsi are in phoenix-vm.cfg.
CONFIG_BLK_DEV_NVME=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

# Display: vmwgfx (VMware's SVGA, VirtualBox's VMSVGA) and Hyper-V's
# synthetic video. virtio-gpu is in phoenix-vm.cfg.
CONFIG_DRM_VMWGFX=y
CONFIG_DRM_HYPERV=y

# Input: USB tablets and keyboards (VMware, VirtualBox, Parallels, Apple
# Virtualization), Hyper-V's synthetic mouse and keyboard.
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HID_HYPERV_MOUSE=y
CONFIG_HYPERV_KEYBOARD=y

# Network cards the hypervisors offer besides virtio-net
CONFIG_VMXNET3=m
CONFIG_E1000E=m
CONFIG_E1000=m
CONFIG_HYPERV_NET=m

# Hyper-V's bus and integration services (shutdown, time sync, KVP),
# its balloon and sockets
CONFIG_HYPERV=y
CONFIG_HYPERV_UTILS=y
CONFIG_HYPERV_BALLOON=y
CONFIG_HYPERV_STORAGE=y
CONFIG_HYPERV_VSOCKETS=m

# VMware's host channel (open-vm-tools)
CONFIG_VMWARE_VMCI=m
CONFIG_VMWARE_VMCI_VSOCKETS=m
