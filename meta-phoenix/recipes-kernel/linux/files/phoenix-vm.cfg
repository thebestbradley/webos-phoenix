# phoenix-vm-arm64 (conf/machine/phoenix-vm-arm64.conf): QEMU's virtual
# hardware, on top of linux-yocto's qemuarm64 BSP. Built in, not modules:
# QEMU boots the kernel directly with no initramfs, so the root's disk,
# its file system and the display must work before any module loads.

# PCI virtio devices (scripts/vm.sh puts every device on PCI)
CONFIG_PCI=y
CONFIG_PCI_HOST_GENERIC=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BALLOON=y
CONFIG_HW_RANDOM_VIRTIO=y

# The root: virtio-blk, ext4
CONFIG_VIRTIO_BLK=y
CONFIG_EXT4_FS=y

# virtio-net
CONFIG_VIRTIO_NET=y

# virtio-gpu, with virgl's 3D when the host offers it (virtio-gpu-gl-pci)
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y

# virtio-input: virtio-multitouch-pci (a touchscreen: ABS_MT_*),
# virtio-tablet-pci and virtio-keyboard-pci
CONFIG_INPUT_EVDEV=y
CONFIG_VIRTIO_INPUT=y

# Sound: virtio-sound-pci, or QEMU's Intel HDA with an hda-duplex codec
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_VIRTIO=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_GENERIC=y

# The serial console (ttyAMA0, PL011)
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
