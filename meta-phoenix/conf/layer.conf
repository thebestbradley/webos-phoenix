# meta-phoenix: puts the Phoenix mobile shell on top of webOS OSE.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-phoenix"
BBFILE_PATTERN_meta-phoenix := "^${LAYERDIR}/"
# Above meta-webos (40) and its BSP layers (50-53).
BBFILE_PRIORITY_meta-phoenix = "60"

LAYERSERIES_COMPAT_meta-phoenix = "scarthgap"
LAYERDEPENDS_meta-phoenix = "meta-webos qt6-layer"
