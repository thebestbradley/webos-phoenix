# meta-phoenix: puts the Phoenix mobile shell on top of webOS: webOS OSE's
# layers (build-webos, scarthgap: scripts/setup-build.sh) or LuneOS's
# (meta-webos-ports, wrynose, Chromium 151: scripts/setup-build-luneos.sh),
# where device images are moving (docs/DECISIONS.md, 15 October 2026).

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# What only one stack has: bbappends to LuneOS's recipes (its Chromium 151
# webruntime), read only when meta-luneos is in the build, so OSE's build
# has no append without its recipe.
BBFILES_DYNAMIC += " \
    meta-luneos:${LAYERDIR}/dynamic-layers/meta-luneos/recipes-*/*/*.bb \
    meta-luneos:${LAYERDIR}/dynamic-layers/meta-luneos/recipes-*/*/*.bbappend \
"

# The layer's own directory, for the machines' wic files (files/wic,
# PHOENIX_WIC_DIR in conf/machine/include/phoenix-mobile.inc).
LAYERDIR_meta-phoenix := "${LAYERDIR}"

BBFILE_COLLECTIONS += "meta-phoenix"
BBFILE_PATTERN_meta-phoenix := "^${LAYERDIR}/"
# Above meta-webos (40) and its BSP layers (50-53), and above meta-luneos
# (20) and LuneOS's backports and holdbacks (33, 34).
BBFILE_PRIORITY_meta-phoenix = "60"

LAYERSERIES_COMPAT_meta-phoenix = "scarthgap wrynose"
# webOS's platform layer is OSE's meta-webos or LuneOS's meta-luneos,
# whichever this build has (bitbake expands this once every layer.conf is
# read, so BBFILE_COLLECTIONS is complete).
LAYERDEPENDS_meta-phoenix = "qt6-layer ${@'meta-luneos' if 'meta-luneos' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else 'meta-webos'}"
