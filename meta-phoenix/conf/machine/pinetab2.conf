#@TYPE: Machine
#@NAME: PINE64 PineTab2
#@DESCRIPTION: PINE64 PineTab2, 10.1" (Rockchip RK3566, Mali-G52 through
#@DESCRIPTION: panfrost, 4 or 8 GB). docs/HARDWARE.md, "First targets".
#
# Boot: the U-Boot in its SPI flash (factory, or Tow-Boot/U-Boot installed
# there for eMMC installs; Debian's PineTab2 page) reads the extlinux.conf
# on the image's FAT boot partition, on an SD card or the eMMC
# (wic/phoenix-extlinux.wks.in). Revisions v0.1 and v2.0 have their own
# device trees; U-Boot's ${fdtfile} picks one.
#
# Wi-Fi: its BES2600 has no mainline driver; DanctNIX's tree carries one
# (linux-phoenix-pinetab2), whose firmware (bes2600/) is not in
# linux-firmware: the Hardware app's catalog (docs/HARDWARE.md).
# Same machine name as LuneOS's meta-pine64-luneos (scarthgap 9b16114).

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/phoenix-mobile.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-phoenix-pinetab2"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/rk3566-pinetab2-v0.1.dtb rockchip/rk3566-pinetab2-v2.0.dtb"
SERIAL_CONSOLES = "1500000;ttyS2"

IMAGE_FSTYPES = "wic.gz wic.bmap"
WKS_FILE = "phoenix-extlinux.wks.in"
IMAGE_BOOT_FILES = "Image \
    rk3566-pinetab2-v0.1.dtb;dtbs/rockchip/rk3566-pinetab2-v0.1.dtb \
    rk3566-pinetab2-v2.0.dtb;dtbs/rockchip/rk3566-pinetab2-v2.0.dtb"
PHOENIX_EXTLINUX_CONF = "phoenix-extlinux-pinetab2.conf"

PACKAGECONFIG:append:pn-mesa = " panfrost kmsro"

MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-rockchip-dptx"
