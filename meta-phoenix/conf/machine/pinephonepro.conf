#@TYPE: Machine
#@NAME: PINE64 PinePhone Pro
#@DESCRIPTION: PINE64 PinePhone Pro (Rockchip RK3399S, Mali-T860 through
#@DESCRIPTION: panfrost, 4 GB). docs/HARDWARE.md, "First targets".
#
# Boot: Tow-Boot in the SPI flash (tow-boot.org, "PINE64 PinePhone Pro";
# postmarketOS requires it too), installed once from its own SD card image
# while holding RE; it reads the extlinux.conf on the image's FAT boot
# partition, on an SD card (hold Volume Down at the second vibration) or the
# eMMC (wic/phoenix-extlinux.wks.in).
#
# Same machine name as LuneOS's meta-pine64-luneos (scarthgap 9b16114).

require conf/machine/include/arm/armv8a/tune-cortexa72-cortexa53.inc
require conf/machine/include/phoenix-mobile.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-phoenix-megi"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/rk3399-pinephone-pro.dtb"
SERIAL_CONSOLES = "115200;ttyS2"

IMAGE_FSTYPES = "wic.gz wic.bmap"
WKS_FILE = "phoenix-extlinux.wks.in"
IMAGE_BOOT_FILES = "Image rk3399-pinephone-pro.dtb;dtbs/rockchip/rk3399-pinephone-pro.dtb"
PHOENIX_EXTLINUX_CONF = "phoenix-extlinux-pinephonepro.conf"

PACKAGECONFIG:append:pn-mesa = " panfrost kmsro"

# DisplayPort over USB-C (rockchip/dptx.bin, LICENCE.rockchip) and the Wi-Fi
# (AP6255, BCM43455) from linux-firmware. Its Bluetooth firmware
# (BCM4345C5.hcd) and the Wi-Fi's board file for this phone are not in
# linux-firmware: the Hardware app's catalog (docs/HARDWARE.md).
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-rockchip-dptx linux-firmware-bcm43455"
