#@TYPE: Machine
#@NAME: Fairphone (Gen. 6) and (Gen. 6+)
#@DESCRIPTION: Fairphone 6 (Snapdragon 7s Gen 3, SM7635) and 6+ (7s Gen 4,
#@DESCRIPTION: SM7635-AC), Qualcomm "milos". docs/HARDWARE.md, "First targets".
#
# One machine for both: postmarketOS/Nura installs one image on either
# ("software-compatible", Nura wiki "Fairphone (Gen. 6)"), and the kernel
# tree has one device tree, milos-fairphone-fp6.dts.
#
# Boot: the phone's own bootloader (Qualcomm ABL, unlocked with Fairphone's
# code) boots an Android boot image from the boot partition (phoenix-bootimg,
# boot-fairphone-fp6.img); the root is the userdata partition, flashed with
# the ext4 image. Header and offsets from pmaports' deviceinfo
# (device/testing/device-fairphone-fp6, pmaports 2116628): header version 2,
# page size 4096, kernel 0x8000, ramdisk 0x01000000, device tree 0x01f00000,
# tags 0x100, and an os_version/patch level far in the future so the
# bootloader's rollback check never refuses it.
#
# Firmware: the phone's DSP, modem, Wi-Fi, Bluetooth, GPU and video firmware
# is Fairphone's/Qualcomm's, signed for this phone, and has no licence to
# redistribute: Phoenix does not ship it. tools/device-firmware.py takes it
# from Fairphone's own factory image at install time and writes it into the
# root image before it is flashed (docs/HARDWARE.md, "Firmware the phone
# brings"). The redistributable part comes from linux-firmware below.

require conf/machine/include/arm/armv8-2a/tune-cortexa76-cortexa55.inc
require conf/machine/include/phoenix-mobile.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-phoenix-milos"
KERNEL_IMAGETYPE = "Image.gz"
KERNEL_DEVICETREE = "qcom/milos-fairphone-fp6.dtb"
SERIAL_CONSOLES = "115200;ttyMSM0"

IMAGE_FSTYPES = "ext4"
EXTRA_IMAGEDEPENDS += "phoenix-bootimg"
PHOENIX_BOOTIMG_DTB = "qcom/milos-fairphone-fp6.dtb"
PHOENIX_BOOTIMG_ARGS = "--header_version 2 --pagesize 4096 --base 0x00000000 \
    --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --dtb_offset 0x01f00000 \
    --tags_offset 0x00000100 --os_version 99.87.36 --os_patch_level 2099-12-31"
# The root is the userdata partition (208.6 GiB; Nura wiki's partition
# table); the kernel finds it by its GPT name, no initramfs needed.
PHOENIX_BOOTIMG_CMDLINE = "root=PARTLABEL=userdata rootfstype=ext4 rootwait rw console=tty0"

# Adreno 810: freedreno. It needs Mesa 26 or later (Adreno gen 8 landed in
# Mesa 26.0); OSE's oe-core has 24.0.7: docs/OPEN-QUESTIONS.md.
PACKAGECONFIG:append:pn-mesa = " freedreno"

# Wi-Fi (WCN6750 through the WPSS: ath11k's board file) and Bluetooth's
# common files from linux-firmware (LICENCE.atheros_firmware, LICENSE.qcom).
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-ath11k linux-firmware-qca"
