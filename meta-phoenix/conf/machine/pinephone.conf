#@TYPE: Machine
#@NAME: PINE64 PinePhone
#@DESCRIPTION: PINE64 PinePhone, revisions 1.1 and 1.2 (Allwinner A64, Mali-400
#@DESCRIPTION: through lima, 2 or 3 GB). docs/HARDWARE.md, "First targets".
#
# Boot: Tow-Boot (U-Boot) on the eMMC's boot partition, installed once from
# its own SD card image (tow-boot.org, "PINE64 PinePhone (A64)"), reads the
# extlinux.conf on the image's FAT boot partition; the image goes on an SD
# card or on the eMMC (wic/phoenix-extlinux.wks.in). U-Boot picks the
# revision's device tree (${fdtfile}) from the boot partition's dtbs/.
#
# Same machine name as LuneOS's meta-pine64-luneos (scarthgap 9b16114), so
# its recipes can be reused where licences allow.
#
# Performance: 2-3 GB of RAM and OpenGL ES 2.0 only (lima); OSE's Chromium
# web runtime will be slow here, and the image must be trimmed for it
# (docs/HARDWARE.md, "First targets").

require conf/machine/include/arm/armv8a/tune-cortexa53.inc
require conf/machine/include/phoenix-mobile.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-phoenix-megi"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "allwinner/sun50i-a64-pinephone-1.1.dtb allwinner/sun50i-a64-pinephone-1.2.dtb"
SERIAL_CONSOLES = "115200;ttyS0"

IMAGE_FSTYPES = "wic.gz wic.bmap"
WKS_FILE = "phoenix-extlinux.wks.in"
IMAGE_BOOT_FILES = "Image \
    sun50i-a64-pinephone-1.1.dtb;dtbs/allwinner/sun50i-a64-pinephone-1.1.dtb \
    sun50i-a64-pinephone-1.2.dtb;dtbs/allwinner/sun50i-a64-pinephone-1.2.dtb"
PHOENIX_EXTLINUX_CONF = "phoenix-extlinux-pinephone.conf"

# lima draws; the display (sun4i-drm) has no 3D of its own: kmsro pairs them.
PACKAGECONFIG:append:pn-mesa = " lima kmsro"

# Wi-Fi (RTL8723CS) from linux-firmware. Its Bluetooth firmware
# (rtl_bt/rtl8723cs_*) is in linux-firmware's catch-all package, and the
# rear camera's autofocus firmware (ov5640_af.bin) has no known licence: the
# Hardware app's catalog, not the image (docs/HARDWARE.md, "First targets").
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-rtl8723"

# The modem (Quectel EG25-G) needs eg25-manager (GPL-3.0, LuneOS and
# postmarketOS package it) to power it up: not in OSE's layers yet
# (docs/OPEN-QUESTIONS.md).
