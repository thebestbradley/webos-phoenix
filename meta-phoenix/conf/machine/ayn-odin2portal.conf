#@TYPE: Machine
#@NAME: AYN Odin 2 Portal
#@DESCRIPTION: AYN Odin 2 Portal, a 7" OLED handheld (Qualcomm QCS8550,
#@DESCRIPTION: Snapdragon 8 Gen 2). Phoenix's tablet. docs/HARDWARE.md, "First targets".
#
# Boot: from a microSD card, as ROCKNIX does, through ROCKNIX's replacement
# bootloader (github.com/ROCKNIX/abl), flashed from Android by its own
# scripts, which back up AYN's first; Android stays on the internal storage
# and the bootloader's menu switches between them. The card has a FAT boot
# partition with the kernel, the device tree and an extlinux.conf, and the
# ext4 root (wic/phoenix-extlinux.wks.in). Whether ROCKNIX's bootloader
# reads this extlinux.conf as it reads ROCKNIX's own is to be confirmed on
# the device (docs/PRE-IMAGE-CHECKLIST.md, H6).
#
# Firmware: the GPU's zap shader, the audio and compute DSPs' firmware and
# the amplifiers' tuning are AYN's, signed for the device, without a licence
# to redistribute: tools/device-firmware.py writes them into the image at
# install time from the device's own copy (docs/HARDWARE.md, "Firmware the
# phone brings").

require conf/machine/include/arm/armv8-2a/tune-cortexa76-cortexa55.inc
require conf/machine/include/phoenix-mobile.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-phoenix-ayn"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "qcom/qcs8550-ayn-odin2portal.dtb"
SERIAL_CONSOLES = "115200;ttyMSM0"

IMAGE_FSTYPES = "wic.gz wic.bmap ext4"
WKS_FILE = "phoenix-extlinux.wks.in"
IMAGE_BOOT_FILES = "Image qcs8550-ayn-odin2portal.dtb"
PHOENIX_EXTLINUX_CONF = "phoenix-extlinux-ayn-odin2portal.conf"

# Adreno 740: freedreno, in a Mesa newer than OSE's 24.0.7
# (docs/OPEN-QUESTIONS.md).
PACKAGECONFIG:append:pn-mesa = " freedreno"

# Wi-Fi 7 and Bluetooth (WCN7850: ath12k, qca) from linux-firmware.
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-ath12k linux-firmware-qca"
