#@TYPE: Machine
#@NAME: webOS Phoenix ARM64 virtual machine
#@DESCRIPTION: An ARM64 QEMU virtual machine (OE's qemuarm64, "virt") that
#@DESCRIPTION: stands in for each of the first targets before the hardware
#@DESCRIPTION: arrives. docs/HARDWARE.md, "Device VMs".
#
# The same packages as the phones and tablets (phoenix-mobile.inc): what
# runs on a Fairphone runs here, on virtual hardware. The device is chosen
# at boot, not at build time: the kernel's command line names it
# (phoenix.device=fairphone-fp6), and phoenix-device-config's
# phoenix-device-select puts that device's device.json and compositor
# geometry in /etc/phoenix before the shell starts. The image carries every
# device's (files/device-profiles.json). scripts/vm.sh starts it with the
# device's CPU count, memory and panel; docs/BUILDING-MAC.md has UTM's
# settings.
#
# Virtual hardware (scripts/vm.sh): virtio-gpu (with GL through virgl where
# the host's QEMU has it: virtio-gpu-gl-pci), virtio-multitouch-pci (QEMU
# 8.0 or later: the host's touches reach the shell as touches) beside
# virtio-tablet-pci (the host's pointer), virtio-net, virtio-blk, and
# virtio-sound-pci (QEMU 8.2 or later) or Intel HDA. Boot: QEMU loads the
# kernel itself (-kernel, -append), so the root is the ext4 image as it is
# built, with no boot loader or partition table; UTM's "Boot from kernel
# image" does the same.
#
# OE's qemuarm64 is the base: its tune (armv8a), linux-yocto with the
# qemuarm64 BSP of the yocto-kernel-cache (KMACHINE qemuarm64; linux-yocto's
# COMPATIBLE_MACHINE names qemuarm64, so it is in MACHINEOVERRIDES too), and
# qemu.inc's qemuall override, which meta-webos already knows from its own
# emulator (luna-surfacemanager's virtual_display_support, Mesa's
# gallium-llvm for llvmpipe where there is no virgl: meta-webos d7ed46c,
# luna-surfacemanager.bb:41, mesa_%.bbappend:6). OSE's machine
# implementation stays "hardware", as on the phones (phoenix-mobile.inc),
# not OSE's x86 "emulator", whose nyx modules and VirtualBox settings are
# for qemux86-64.

MACHINEOVERRIDES =. "qemuarm64:"
require conf/machine/qemuarm64.conf
require conf/machine/include/phoenix-mobile.inc

# The VM's kernel: linux-yocto for qemuarm64 with the virtual devices built
# in (no initramfs: the root's disk and file system must be there at
# boot), OSE's needs and the hardware modules every image has
# (recipes-kernel/linux/linux-yocto_%.bbappend).
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES = "115200;ttyAMA0"

# The root file system as a raw ext4 image (vm.sh puts a copy-on-write
# overlay over it, so the build's own image stays as built), with room for
# the apps and data a device would have.
IMAGE_FSTYPES = "ext4"
IMAGE_ROOTFS_EXTRA_SPACE = "4194304"

# virtio-gpu draws through virgl (Mesa's virgl driver, in mesa.inc's
# default PACKAGECONFIG with opengl: oe-core scarthgap mesa.inc:87) when the
# host has it, else Mesa's llvmpipe (gallium-llvm, meta-webos's qemuall
# setting).

# For runqemu (OE's own launcher; scripts/vm.sh is the documented way):
# the same devices as vm.sh, at a phone's size.
QB_MEM = "-m 4096"
QB_SMP = "-smp 4"
QB_GRAPHICS = "-device virtio-gpu-pci,xres=720,yres=1440"
QB_OPT_APPEND = "-device virtio-multitouch-pci -device virtio-tablet-pci -device virtio-keyboard-pci"
QB_KERNEL_CMDLINE_APPEND = "phoenix.device=pinephonepro"
