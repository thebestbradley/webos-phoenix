#
# The SSH server of a production image (PHOENIX_PRODUCTION = "1"), which
# runs only while Developer Mode is on (phoenix-devmode-ssh's drop-ins):
# the device's `user` account alone, by key alone, the keys being those
# of the computers paired with the device (novad writes them into
# /home/user/.ssh/authorized_keys; docs/DEV-PUSH.md 6.4). Read before the
# rest of sshd_config (its Include comes first; the first value wins).
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AllowUsers user
AuthorizedKeysFile .ssh/authorized_keys
