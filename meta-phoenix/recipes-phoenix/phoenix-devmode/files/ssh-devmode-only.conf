#
# A production image's SSH server starts only with Developer Mode on (its
# flag, OSE's: com.palm.service.devmode and Phoenix's services/devmode
# keep it). Turning Developer Mode on or off restarts the device, so the
# condition is checked at each start.
[Unit]
ConditionPathExists=/var/luna/preferences/devmode_enabled
