#
# webOS Phoenix's A/B boot (GRUB on UEFI: phoenix-ab-efi.wks.in). Two root
# slots, A and B, each with its own kernel (/boot/Image in the slot), and
# RAUC's GRUB variables in EFI/BOOT/grubenv beside this file
# (docs/PLATFORM-CLIENT.md, "System updates"):
#
#   ORDER    the slots in the order to try them ("A B"; RAUC's mark-active
#            puts the slot it activates first)
#   X_OK     1: slot X may boot (mark-good and mark-active set 1, mark-bad 0)
#   X_TRY    how many times this boot loader started X since RAUC last
#            marked it good or active (both set 0)
#
# Each start takes the first slot in ORDER with X_OK=1 that has been tried
# fewer than three times, counts the try and boots it. com.palm.update marks
# the running slot good when the System UI is up (rauc status mark-good, which
# sets X_TRY=0), so a new system that never gets there (a kernel panic, which
# panic= restarts, or a hang the user ends with the power button) is skipped
# after its third try, and the slot that worked before starts again: the
# boot counter. RAUC counts a slot good only at X_TRY=0
# (rauc/src/bootloaders/grub.c), so a slot being tried shows as "bad" in
# `rauc status` until it is marked good.
#
# PHOENIX_ARGS (grubenv) is added to the kernel's command line: the VM's
# console and device (phoenix.device=, phoenix-device-select).

set default=0
set timeout=0

set ORDER="A B"
set A_OK=0
set A_TRY=0
set B_OK=0
set B_TRY=0
set PHOENIX_ARGS=""
load_env

# This file's disk: $root is its partition ("hd0,gpt1"); the slots are the
# second and third partitions of the same disk.
regexp --set=1:disk '^([^,]+),' "$root"

function tries_left {
    # $1: a slot's X_TRY. Sets "next" to the count after this try, or ""
    # when it has had its three.
    if [ "$1" = "0" ]; then set next=1
    elif [ "$1" = "1" ]; then set next=2
    elif [ "$1" = "2" ]; then set next=3
    else set next=""
    fi
}

function boot_slot {
    # $1: A or B. Returns only if the kernel could not be loaded.
    if [ "$1" = "A" ]; then
        set part=gpt2
        set label=phoenix-root-a
    else
        set part=gpt3
        set label=phoenix-root-b
    fi
    echo "webOS Phoenix: slot $1 (A_OK=$A_OK A_TRY=$A_TRY B_OK=$B_OK B_TRY=$B_TRY ORDER=$ORDER)"
    if linux ($disk,$part)/boot/Image root=PARTLABEL=$label rootfstype=ext4 rootwait rw panic=10 \
            rauc.slot=$1 phoenix.data=PARTLABEL=phoenix-data phoenix.esp=PARTLABEL=phoenix-boot $PHOENIX_ARGS; then
        boot
    fi
    echo "webOS Phoenix: slot $1 has no kernel"
}

# The slot to try, counted before it starts.
set slot=""
for s in $ORDER; do
    if [ -z "$slot" ]; then
        if [ "$s" = "A" ]; then set ok="$A_OK"; set try="$A_TRY"; fi
        if [ "$s" = "B" ]; then set ok="$B_OK"; set try="$B_TRY"; fi
        if [ "$ok" = "1" ]; then
            tries_left "$try"
            if [ -n "$next" ]; then
                set slot="$s"
                if [ "$s" = "A" ]; then set A_TRY="$next"; else set B_TRY="$next"; fi
            fi
        fi
    fi
done

if [ -n "$slot" ]; then
    save_env A_TRY B_TRY
    boot_slot "$slot"
fi

# No slot with tries left (or its kernel did not load): never leave the
# device without a system. Every slot marked bootable, in ORDER, without
# counting; then A, the slot the image was written with.
for s in $ORDER; do
    if [ "$s" = "A" ]; then set ok="$A_OK"; fi
    if [ "$s" = "B" ]; then set ok="$B_OK"; fi
    if [ "$ok" = "1" -a "$s" != "$slot" ]; then
        boot_slot "$s"
    fi
done
boot_slot A
