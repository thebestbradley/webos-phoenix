# What RAUC and the A/B layout need of the kernel (meta-rauc's own
# linux-yocto/rauc.cfg, which needs DISTRO_FEATURES "rauc", which Phoenix
# does not set: conf/layer.conf), built in.

# Verity bundles (phoenix-bundle.bb): a SquashFS image on a loop device,
# each block checked by dm-verity as it is read. (Loop stays a module, as
# the image has it: kernel-module-loop, loaded on /dev/loop-control.)
CONFIG_MISC_FILESYSTEMS=y
CONFIG_SQUASHFS=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y

# The data partition's /var, /home and /media are overlays on the slot's
# (phoenix-slots)
CONFIG_OVERLAY_FS=y

# UEFI and GRUB: the kernel is an EFI application GRUB starts, and the EFI
# system partition (FAT) holds GRUB's environment, which RAUC writes
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
