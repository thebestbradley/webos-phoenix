# webOS Phoenix: RAUC's slots on phoenix-vm-arm64 (the ARM64 VM booted with
# UEFI from the A/B disk, files/wic/phoenix-ab-efi.wks.in). GRUB picks the
# slot (files/wic/phoenix-ab-grub.cfg) from its environment on the EFI
# system partition, which phoenix-slots mounts at /boot/efi; com.palm.update
# installs bundles and marks the running slot good after the System UI
# starts (docs/PLATFORM-CLIENT.md, "System updates").

[system]
# The device type: the update feed's <compatible> (PLATFORM.md 6.9) and
# com.palm.update's, the account service's (services/account/deviceinfo.js)
compatible=phoenix-vm-arm64
bootloader=grub
grubenv=/boot/efi/EFI/BOOT/grubenv
# Verity bundles only (phoenix-bundle.bb): each block checked as it is read
bundle-formats=-plain
# RAUC's own record of the slots (what was installed, when) on the data
# partition, so both slots see it
data-directory=/data/rauc

[keyring]
# The CA that signed the bundles this image accepts: the test CA in test
# images (meta-phoenix/files/rauc/test; PRE-IMAGE-CHECKLIST.md U3)
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/phoenix-root-a
type=ext4
bootname=A
# The bundle's file system is the size it was built at; grow it to the slot
resize=true

[slot.rootfs.1]
device=/dev/disk/by-partlabel/phoenix-root-b
type=ext4
bootname=B
resize=true
