# RAUC's daemon only on a boot from an update slot (rauc.slot=, the A/B
# disk's GRUB: phoenix-ab-grub.cfg). Without one (a VM started straight
# from the image's ext4) RAUC finds no booted slot and exits, and every
# D-Bus activation of it waited 25 s and started it again (Revision 42's
# regression VM, 28 November 2026). com.palm.update asks nothing of RAUC
# there (services/updates/lib/node.js, NOT_AVAILABLE).
[Unit]
ConditionKernelCommandLine=rauc.slot
