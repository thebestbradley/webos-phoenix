<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!--
  The glass disc a user app's object lies on, after the platter of the
  Open webOS core apps' icons (com.palm.app.calculator / calendar
  icon-256x256.png, Apache-2.0), measured there: centred, radius 112.5 of
  256; white, 40 % opaque over its top third, fading to about 6 % below the
  middle; a brighter rim on the lower sides; a soft black halo about 13 units
  wide outside it and none inside. Drawn anew for Phoenix (no pixels copied).
-->
<defs>
  <linearGradient id="pl-fill" gradientUnits="userSpaceOnUse" x1="0" y1="15.5" x2="0" y2="240.5">
    <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
    <stop offset="0.28" stop-color="#fff" stop-opacity="0.385"/>
    <stop offset="0.43" stop-color="#fff" stop-opacity="0.24"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.155"/>
    <stop offset="0.57" stop-color="#fff" stop-opacity="0.10"/>
    <stop offset="0.66" stop-color="#fff" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
  </linearGradient>
  <radialGradient id="pl-rim" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="112.5">
    <stop offset="0.867" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.907" stop-color="#fff" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.17"/>
  </radialGradient>
  <linearGradient id="pl-rim-fade" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="125">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <mask id="pl-rim-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect width="256" height="256" fill="url(#pl-rim-fade)"/>
  </mask>
  <mask id="pl-outside" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect width="256" height="256" fill="#fff"/>
    <circle cx="128" cy="128" r="112.5" fill="#000"/>
  </mask>
  <filter id="pl-halo" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>
<g mask="url(#pl-outside)">
  <circle cx="128" cy="128" r="112.5" fill="#000" opacity="0.2" filter="url(#pl-halo)"/>
</g>
<circle cx="128" cy="128" r="112.5" fill="url(#pl-fill)"/>
<circle cx="128" cy="128" r="112.5" fill="url(#pl-rim)" mask="url(#pl-rim-mask)"/>
<circle cx="128" cy="128" r="112" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1"/>
</svg>
