<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Settings > Hotspot & Tethering: a phone standing on the system icons'
     diamond (its foot at y = 176), sending its connection out in arcs on
     either side. Original Phoenix art. -->
<defs>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1b1e21"/>
    <stop offset="0.4" stop-color="#4b5157"/>
    <stop offset="1" stop-color="#16181b"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fd6ff"/>
    <stop offset="1" stop-color="#2a74c0"/>
  </linearGradient>
</defs>
<g>
  <rect x="100" y="66" width="56" height="110" rx="12" fill="url(#phone)" stroke="#0c0d0e" stroke-width="3"/>
  <rect x="108" y="80" width="40" height="70" rx="3" fill="url(#screen)"/>
  <circle cx="128" cy="163" r="5" fill="#6c737a"/>
  <g fill="none" stroke="#2a8be0" stroke-width="7" stroke-linecap="round">
    <path d="M84 92 A 40 40 0 0 0 84 140"/><path d="M66 80 A 58 58 0 0 0 66 152"/>
    <path d="M172 92 A 40 40 0 0 1 172 140"/><path d="M190 80 A 58 58 0 0 1 190 152"/>
  </g>
</g>
</svg>
