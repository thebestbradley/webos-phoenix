<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Zoom (the Zoom account's connector: meetings in Calendar): a video camera before a calendar day,
     drawn for Phoenix (Apache-2.0). Not Zoom's logo. -->
<defs>
  <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e5e9ef"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a96a8"/><stop offset="1" stop-color="#5d6a7d"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa4f5"/><stop offset="1" stop-color="#2163c4"/></linearGradient>
  <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#cfe6ff"/><stop offset="0.5" stop-color="#3a6ea8"/><stop offset="1" stop-color="#14365e"/></radialGradient>
</defs>
<rect x="56" y="52" width="104" height="96" rx="9" fill="url(#day)" stroke="#5d6a7d" stroke-width="3"/>
<path d="M56 61 a9 9 0 0 1 9 -9 h86 a9 9 0 0 1 9 9 v14 H56 z" fill="url(#head)"/>
<path d="M72 92 h44 M72 108 h60 M72 124 h36" stroke="#b8c1cd" stroke-width="5" stroke-linecap="round"/>
<!-- The camera. -->
<rect x="92" y="118" width="88" height="62" rx="12" fill="url(#body)" stroke="#173f7c" stroke-width="3"/>
<path d="M180 136 l30 -16 v58 l-30 -16 z" fill="url(#body)" stroke="#173f7c" stroke-width="3" stroke-linejoin="round"/>
<circle cx="126" cy="149" r="17" fill="url(#lens)" stroke="#0f2b4d" stroke-width="2.5"/>
<circle cx="164" cy="132" r="4" fill="#d6ffe4"/>
</svg>
