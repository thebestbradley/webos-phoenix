<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- QR Scanner: a printed QR code card, a red scan line across it. Original
     Phoenix art; the code is a made-up pattern, not a readable one. -->
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e2e6ea"/>
  </linearGradient>
  <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2a1a" stop-opacity="0"/>
    <stop offset="0.15" stop-color="#ff3a2a"/>
    <stop offset="0.85" stop-color="#ff3a2a"/>
    <stop offset="1" stop-color="#ff2a1a" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <!-- A finder pattern, 42 units. -->
  <g id="finder">
    <rect x="3" y="3" width="36" height="36" fill="none" stroke="#1d2125" stroke-width="6"/>
    <rect x="12" y="12" width="18" height="18" fill="#1d2125"/>
  </g>
</defs>
<g filter="url(#c-lift)" transform="rotate(-6 128 128)">
  <rect x="34" y="34" width="188" height="188" rx="12" fill="url(#card)" stroke="#7d868f" stroke-width="2"/>
  <g transform="translate(50 50)">
    <use href="#finder"/>
    <use href="#finder" x="114"/>
    <use href="#finder" y="114"/>
    <g fill="#1d2125">
      <rect x="54" y="0" width="12" height="12"/><rect x="78" y="6" width="12" height="18"/>
      <rect x="60" y="24" width="18" height="12"/><rect x="54" y="48" width="12" height="18"/>
      <rect x="0" y="54" width="18" height="12"/><rect x="30" y="60" width="12" height="12"/>
      <rect x="78" y="48" width="24" height="12"/><rect x="114" y="54" width="12" height="12"/>
      <rect x="138" y="54" width="18" height="18"/><rect x="96" y="72" width="12" height="18"/>
      <rect x="66" y="78" width="18" height="12"/><rect x="12" y="78" width="12" height="12"/>
      <rect x="120" y="84" width="24" height="12"/><rect x="54" y="102" width="12" height="24"/>
      <rect x="78" y="114" width="18" height="12"/><rect x="108" y="108" width="12" height="18"/>
      <rect x="132" y="114" width="24" height="12"/><rect x="60" y="138" width="24" height="12"/>
      <rect x="96" y="132" width="12" height="24"/><rect x="120" y="138" width="12" height="12"/>
      <rect x="144" y="138" width="12" height="18"/><rect x="114" y="150" width="18" height="6"/>
      <rect x="36" y="96" width="12" height="12"/><rect x="0" y="96" width="12" height="6"/>
    </g>
  </g>
</g>
<!-- Corner brackets of the viewfinder. -->
<g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#c-lift)">
  <path d="M22 62V22H62M194 22H234V62M234 194V234H194M62 234H22V194" stroke="#2e3338" stroke-width="11"/>
  <path d="M22 62V22H62M194 22H234V62M234 194V234H194M62 234H22V194"/>
</g>
<rect x="14" y="122" width="228" height="12" fill="url(#laser)" filter="url(#glow)" opacity="0.9"/>
<rect x="14" y="126" width="228" height="4" fill="url(#laser)"/>
</svg>
