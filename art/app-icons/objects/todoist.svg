<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Todoist (the Todoist account's connector): a card of tasks, two ticked off, drawn for Phoenix (Apache-2.0).
     Not Todoist's logo. -->
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ebe6dc"/></linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8705e"/><stop offset="1" stop-color="#b8402f"/></linearGradient>
  <linearGradient id="tick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2563f"/><stop offset="1" stop-color="#a7311f"/></linearGradient>
</defs>
<!-- The card, a little turned, with its red band. -->
<g transform="rotate(-4 128 120)">
  <rect x="62" y="52" width="132" height="132" rx="10" fill="url(#card)" stroke="#8d8573" stroke-width="3"/>
  <path d="M62 66 a10 10 0 0 1 10 -10 h112 a10 10 0 0 1 10 10 v8 H62 z" fill="url(#band)"/>
  <!-- Three tasks: two done (a tick, the line struck), one open. -->
  <rect x="78" y="88" width="18" height="18" rx="4" fill="#fff" stroke="#9d9585" stroke-width="2.5"/>
  <path d="M81 97 l6 6 l13 -16" fill="none" stroke="url(#tick)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 97 h70" stroke="#b9b1a1" stroke-width="5" stroke-linecap="round"/>
  <rect x="78" y="118" width="18" height="18" rx="4" fill="#fff" stroke="#9d9585" stroke-width="2.5"/>
  <path d="M81 127 l6 6 l13 -16" fill="none" stroke="url(#tick)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 127 h58" stroke="#b9b1a1" stroke-width="5" stroke-linecap="round"/>
  <rect x="78" y="148" width="18" height="18" rx="4" fill="#fff" stroke="#9d9585" stroke-width="2.5"/>
  <path d="M106 157 h64" stroke="#5c564b" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
