</defs>
<g>
  <path d="M70 100 C 70 84 86 78 100 80 L 156 80 C 170 78 186 84 186 100 L 200 156 C 204 176 182 182 170 168 L 154 148 L 102 148 L 86 168 C 74 182 52 176 56 156 Z"
