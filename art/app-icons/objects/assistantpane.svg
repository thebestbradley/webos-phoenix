<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Settings > Assistant: assistant.svg, smaller, standing on the system
     icons' diamond (its foot at y = 176). Original Phoenix art. -->
<defs>
  <linearGradient id="as-balloon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dfe4ee"/>
  </linearGradient>
  <radialGradient id="as-orb" cx="0.38" cy="0.32" r="0.75">
    <stop offset="0" stop-color="#f3eaff"/>
    <stop offset="0.25" stop-color="#9c7bff"/>
    <stop offset="0.6" stop-color="#4f3bd6"/>
    <stop offset="1" stop-color="#22145e"/>
  </radialGradient>
  <linearGradient id="as-wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5ac8fa"/>
    <stop offset="0.5" stop-color="#ff5fa2"/>
    <stop offset="1" stop-color="#ffb340"/>
  </linearGradient>
  <radialGradient id="as-glint" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
</defs>
<g transform="translate(28.2 9.9) scale(0.78)">
<g filter="url(#c-lift)">
  <!-- The balloon, its tail at the lower left. -->
  <path d="M128 36C181 36 222 70 222 114C222 158 181 192 128 192C116 192 105 190 95 187L56 212C51 215 46 211 48 206L60 172C44 157 34 137 34 114C34 70 75 36 128 36Z"
        fill="url(#as-balloon)" stroke="#4a5260" stroke-width="3" stroke-linejoin="round"/>
  <path d="M128 46C176 46 211 76 211 112" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- The orb. -->
  <circle cx="128" cy="114" r="56" fill="url(#as-orb)" stroke="#1d1250" stroke-width="2.5"/>
  <!-- Its voice: three bands across it. -->
  <g fill="none" stroke="url(#as-wave)" stroke-linecap="round">
    <path d="M80 114C92 92 104 92 116 114C128 136 140 136 152 114C164 92 170 98 176 106" stroke-width="7"/>
    <path d="M82 124C94 108 106 106 118 122C130 138 142 140 154 124C164 112 170 114 174 120" stroke-width="4" opacity="0.75"/>
    <path d="M84 104C96 96 108 98 120 106C132 114 144 112 156 104C164 99 170 100 172 102" stroke-width="3" opacity="0.6"/>
  </g>
  <ellipse cx="108" cy="86" rx="22" ry="12" fill="url(#as-glint)" transform="rotate(-25 108 86)"/>
</g>
</g>
</svg>
