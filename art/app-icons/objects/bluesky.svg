<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Bluesky (the Bluesky account's connector): a round window on a blue sky with a cloud and a speech balloon,
     drawn for Phoenix (Apache-2.0). Not Bluesky's butterfly logo. -->
<defs>
  <radialGradient id="sky" cx="0.45" cy="0.3" r="0.8"><stop offset="0" stop-color="#9fd3ff"/><stop offset="0.6" stop-color="#3c8ee6"/><stop offset="1" stop-color="#1d5bb0"/></radialGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3e3f3"/></linearGradient>
  <linearGradient id="talk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6eef7"/></linearGradient>
</defs>
<circle cx="128" cy="116" r="66" fill="url(#sky)" stroke="#164a8f" stroke-width="3.5"/>
<ellipse cx="114" cy="80" rx="34" ry="12" fill="#ffffff" fill-opacity="0.28"/>
<!-- The cloud across the sky. -->
<path d="M84 140 a18 18 0 0 1 3 -35.7 a24 24 0 0 1 45.9 -4.8 a16.5 16.5 0 0 1 17.1 16.5 a12 12 0 0 1 -1.5 24 z" fill="url(#cloud)" stroke="#5f84ab" stroke-width="3"/>
<!-- The speech balloon in front. -->
<path d="M146 136 h40 a12 12 0 0 1 12 12 v18 a12 12 0 0 1 -12 12 h-18 l-12 12 v-12 h-10 a12 12 0 0 1 -12 -12 v-18 a12 12 0 0 1 12 -12 z" fill="url(#talk)" stroke="#2f5f96" stroke-width="3"/>
<circle cx="154" cy="157" r="4" fill="#3c8ee6"/><circle cx="166" cy="157" r="4" fill="#3c8ee6"/><circle cx="178" cy="157" r="4" fill="#3c8ee6"/>
</svg>
