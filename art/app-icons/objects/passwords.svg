<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Passwords: a brass key and a steel one on a ring. Original Phoenix art
     (legacy webOS had no password manager). -->
<defs>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff2b0"/>
    <stop offset="0.35" stop-color="#e8b836"/>
    <stop offset="0.7" stop-color="#b9831a"/>
    <stop offset="1" stop-color="#7a520c"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.4" stop-color="#cdd2d7"/>
    <stop offset="0.75" stop-color="#8d949b"/>
    <stop offset="1" stop-color="#5f666d"/>
  </linearGradient>
  <!-- A key, bow at the origin, pointing along +x. -->
  <path id="key" d="M33.3 -7H124V7H112V24H98V7H86V24H72V7H33.3A34 34 0 1 1 33.3 -7ZM-20 0A12 12 0 1 0 4 0A12 12 0 1 0 -20 0Z" fill-rule="evenodd"/>
</defs>
<!-- The ring. -->
<circle cx="70" cy="70" r="44" fill="none" stroke="#454b51" stroke-width="11"/>
<circle cx="70" cy="70" r="44" fill="none" stroke="url(#steel)" stroke-width="6.5"/>
<!-- Steel key, lying under. -->
<g filter="url(#c-lift)" transform="translate(92 96) rotate(66) scale(1.05)">
  <use href="#key" fill="url(#steel)" stroke="#4a5157" stroke-width="3"/>
  <path d="M40 4H118" stroke="#fff" stroke-width="3" opacity="0.6"/>
</g>
<!-- Brass key on top. -->
<g filter="url(#c-lift)" transform="translate(98 94) rotate(30) scale(1.2)">
  <use href="#key" fill="url(#brass)" stroke="#6a4508" stroke-width="3"/>
  <path d="M40 -3H120" stroke="#fff6cc" stroke-width="3" opacity="0.7"/>
  <ellipse cx="-12" cy="-20" rx="12" ry="6" fill="#fff" opacity="0.5"/>
</g>
</svg>
