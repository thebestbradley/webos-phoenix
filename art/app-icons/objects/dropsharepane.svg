<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Settings > DropShare: a white card with a code of squares standing on
     the system icons' diamond (its foot at y = 176), a blue arrow curving
     off it. Original Phoenix art. -->
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#cfd5db"/>
  </linearGradient>
  <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fd0ff"/>
    <stop offset="0.5" stop-color="#2a8be0"/>
    <stop offset="1" stop-color="#14589a"/>
  </linearGradient>
</defs>
<g>
  <rect x="80" y="70" width="96" height="106" rx="10" fill="url(#card)" stroke="#4d545b" stroke-width="3"/>
  <g fill="#23272b">
    <rect x="92" y="82" width="24" height="24" rx="2"/><rect x="140" y="82" width="24" height="24" rx="2"/><rect x="92" y="138" width="24" height="24" rx="2"/>
    <rect x="124" y="84" width="8" height="8"/><rect x="124" y="102" width="8" height="8"/><rect x="132" y="116" width="8" height="8"/>
    <rect x="94" y="116" width="8" height="8"/><rect x="110" y="120" width="8" height="8"/><rect x="148" y="118" width="8" height="8"/>
    <rect x="124" y="134" width="8" height="8"/><rect x="138" y="146" width="8" height="8"/><rect x="152" y="138" width="8" height="8"/>
  </g>
  <g fill="#ffffff"><rect x="97" y="87" width="14" height="14"/><rect x="145" y="87" width="14" height="14"/><rect x="97" y="143" width="14" height="14"/></g>
  <g fill="#23272b"><rect x="101" y="91" width="6" height="6"/><rect x="149" y="91" width="6" height="6"/><rect x="101" y="147" width="6" height="6"/></g>
  <path d="M160 60 C 186 54 204 66 208 92 L 222 88 L 204 122 L 180 94 L 194 94 C 190 78 178 70 160 72 Z"
