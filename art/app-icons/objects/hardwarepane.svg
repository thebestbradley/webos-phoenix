<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Settings > Hardware: a circuit board standing on the system icons'
     diamond (its gold edge connector at y = 176), a chip in its middle with
     traces running to it. Original Phoenix art. -->
<defs>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3fae5a"/>
    <stop offset="0.55" stop-color="#1f7d3b"/>
    <stop offset="1" stop-color="#145a2a"/>
  </linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4f55"/>
    <stop offset="1" stop-color="#1c1f22"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbe08a"/>
    <stop offset="1" stop-color="#c08a1e"/>
  </linearGradient>
  <linearGradient id="pin" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9aa1a8"/>
    <stop offset="0.5" stop-color="#f2f4f6"/>
    <stop offset="1" stop-color="#9aa1a8"/>
