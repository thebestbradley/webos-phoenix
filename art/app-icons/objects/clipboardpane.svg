<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Settings > Clipboard: clipboard.svg, smaller, standing on the system
     icons' diamond (its foot at y = 176). Original Phoenix art. -->
<defs>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c98f52"/>
    <stop offset="0.5" stop-color="#a86a32"/>
    <stop offset="1" stop-color="#7a4718"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e4e8ec"/>
  </linearGradient>
  <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef1f4"/>
    <stop offset="1" stop-color="#c9cfd5"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#c3c8cd"/>
    <stop offset="0.55" stop-color="#868c93"/>
    <stop offset="1" stop-color="#dfe3e7"/>
  </linearGradient>
</defs>
<g transform="translate(28.2 4.4) scale(0.78)">
<g filter="url(#c-lift)">
  <!-- The board. -->
  <rect x="58" y="40" width="140" height="180" rx="12" fill="url(#board)" stroke="#4f2c0c" stroke-width="3"/>
  <rect x="64" y="46" width="128" height="168" rx="8" fill="none" stroke="#e3b47c" stroke-width="2" opacity="0.45"/>
  <!-- A clip behind, turned a little, like a card in card view. -->
  <g transform="rotate(-7 128 136)">
    <rect x="80" y="66" width="96" height="128" rx="7" fill="url(#paperBack)" stroke="#6c737a" stroke-width="2"/>
  </g>
  <!-- The front clip, with its text. -->
  <rect x="78" y="72" width="100" height="134" rx="7" fill="url(#paper)" stroke="#5d646b" stroke-width="2.5"/>
  <g stroke-linecap="round">
    <path d="M92 104H164" stroke="#4a5158" stroke-width="7"/>
    <path d="M92 124H158" stroke="#9aa1a8" stroke-width="5"/>
    <path d="M92 140H164" stroke="#9aa1a8" stroke-width="5"/>
    <path d="M92 156H146" stroke="#9aa1a8" stroke-width="5"/>
    <path d="M92 176H130" stroke="#3a8bd9" stroke-width="5"/>
  </g>
  <!-- The clip at the top. -->
  <path d="M96 34H160V52C160 58 156 62 150 62H106C100 62 96 58 96 52Z" fill="url(#chrome)" stroke="#3a3f44" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="112" y="22" width="32" height="20" rx="8" fill="none" stroke="#3a3f44" stroke-width="9"/>
  <rect x="112" y="22" width="32" height="20" rx="8" fill="none" stroke="url(#chrome)" stroke-width="5"/>
  <path d="M102 40H154" stroke="#fff" stroke-width="3" opacity="0.6"/>
</g>
</g>
</svg>
