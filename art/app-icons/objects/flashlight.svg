<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Flashlight: a black and chrome torch, lit, its beam falling across the
     disc. Original Phoenix art. -->
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6b7178"/>
    <stop offset="0.3" stop-color="#2c3035"/>
    <stop offset="0.7" stop-color="#121416"/>
    <stop offset="1" stop-color="#3a3f44"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#c3c8cd"/>
    <stop offset="0.55" stop-color="#8a9097"/>
    <stop offset="1" stop-color="#e3e6e9"/>
  </linearGradient>
  <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#fff7c8"/>
    <stop offset="1" stop-color="#f2d36a"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fffbe0" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
  </linearGradient>
  <pattern id="knurl" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0 6L6 0M-1 1L1 -1M5 7L7 5" stroke="#000" stroke-width="1.2" opacity="0.5"/>
  </pattern>
  <clipPath id="grip"><rect x="0" y="-22" width="92" height="44" rx="6"/></clipPath>
</defs>
<g transform="translate(26 210) rotate(-40) scale(1.1)">
  <!-- The beam, in front of the head. -->
  <path d="M160 -34L204 -52V52L160 34Z" fill="url(#beam)" opacity="0.85"/>
  <g filter="url(#c-lift)">
    <!-- Tail cap, grip, neck, head. -->
    <rect x="-14" y="-18" width="18" height="36" rx="5" fill="url(#chrome)" stroke="#3a3f44" stroke-width="2"/>
    <rect x="0" y="-22" width="92" height="44" rx="6" fill="url(#body)" stroke="#0b0c0d" stroke-width="2"/>
    <g clip-path="url(#grip)"><rect x="12" y="-22" width="68" height="44" fill="url(#knurl)"/></g>
    <rect x="34" y="-27" width="24" height="10" rx="3" fill="#c7362a" stroke="#5e130d" stroke-width="1.5"/>
    <path d="M92 -22L120 -36H154V36H120L92 22Z" fill="url(#body)" stroke="#0b0c0d" stroke-width="2" stroke-linejoin="round"/>
    <rect x="150" y="-40" width="14" height="80" rx="4" fill="url(#chrome)" stroke="#3a3f44" stroke-width="2"/>
    <ellipse cx="164" cy="0" rx="8" ry="36" fill="url(#lens)" stroke="#8a7a3a" stroke-width="1.5"/>
    <path d="M6 -16H86" stroke="#fff" stroke-width="3" opacity="0.35"/>
  </g>
</g>
</svg>
