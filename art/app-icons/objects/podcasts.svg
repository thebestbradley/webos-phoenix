<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Podcasts: a violet portable radio, its antenna up. Original Phoenix art
     (legacy webOS had no podcast app). -->
<defs>
  <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b78ce8"/>
    <stop offset="0.45" stop-color="#8048c6"/>
    <stop offset="1" stop-color="#4d1f8a"/>
  </linearGradient>
  <radialGradient id="grille" cx="0.4" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#e9ebee"/>
    <stop offset="0.7" stop-color="#a7adb4"/>
    <stop offset="1" stop-color="#6f767e"/>
  </radialGradient>
  <pattern id="holes" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="4.5" cy="4.5" r="2.3" fill="#2c2f33"/>
  </pattern>
  <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff7dc"/>
    <stop offset="1" stop-color="#e9d6a0"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="knob" cx="0.4" cy="0.3" r="0.7">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.6" stop-color="#b5bbc1"/>
    <stop offset="1" stop-color="#6b7178"/>
  </radialGradient>
</defs>
<!-- Antenna and handle. -->
<path d="M190 92L226 18" stroke="#5d646b" stroke-width="7" stroke-linecap="round"/>
<path d="M190 92L226 18" stroke="#eef0f2" stroke-width="3" stroke-linecap="round"/>
<circle cx="226" cy="18" r="6" fill="url(#knob)" stroke="#4a5056" stroke-width="1.5"/>
<path d="M64 92V70C64 56 72 50 86 50H170C184 50 192 56 192 70V92" fill="none" stroke="#3b3f44" stroke-width="13" stroke-linecap="round"/>
<path d="M64 92V70C64 56 72 50 86 50H170C184 50 192 56 192 70V92" fill="none" stroke="#c9ced3" stroke-width="7" stroke-linecap="round"/>
<!-- The case. -->
<rect x="22" y="84" width="212" height="134" rx="22" fill="url(#case)" stroke="#33115e" stroke-width="2.5"/>
<rect x="26" y="88" width="204" height="56" rx="18" fill="url(#gloss)"/>
<!-- Speaker. -->
<circle cx="88" cy="154" r="48" fill="url(#grille)" stroke="#3a1a66" stroke-width="2.5"/>
<circle cx="88" cy="154" r="39" fill="url(#holes)" opacity="0.85"/>
<circle cx="88" cy="154" r="39" fill="none" stroke="#7d848b" stroke-width="2"/>
<!-- Tuning dial and knobs. -->
<rect x="148" y="112" width="68" height="40" rx="5" fill="url(#dial)" stroke="#3a1a66" stroke-width="2"/>
<path d="M156 140V146M164 136V146M172 140V146M180 136V146M188 140V146M196 136V146M204 140V146" stroke="#7a6a44" stroke-width="2"/>
<path d="M181 116V148" stroke="#d1322a" stroke-width="3"/>
<rect x="148" y="112" width="68" height="16" rx="5" fill="#fff" opacity="0.35"/>
<circle cx="164" cy="184" r="15" fill="url(#knob)" stroke="#3a1a66" stroke-width="2"/>
<circle cx="202" cy="184" r="15" fill="url(#knob)" stroke="#3a1a66" stroke-width="2"/>
<path d="M164 172V182M202 172V182" stroke="#4a5056" stroke-width="3" stroke-linecap="round"/>
</svg>
