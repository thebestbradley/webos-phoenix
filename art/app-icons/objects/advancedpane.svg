<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- Settings > Advanced (the community's Tweaks): a brushed metal mixing
     panel with three sliders set at different heights, standing on the
     system icons' diamond (its foot at y = 176). Original Phoenix art. -->
<defs>
  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f6f8"/>
    <stop offset="0.5" stop-color="#b9bfc5"/>
    <stop offset="1" stop-color="#7d848b"/>
  </linearGradient>
  <linearGradient id="slot" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1c1f22"/>
    <stop offset="0.5" stop-color="#3b4046"/>
    <stop offset="1" stop-color="#1c1f22"/>
  </linearGradient>
  <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#d4d8dc"/>
    <stop offset="0.55" stop-color="#9aa0a6"/>
    <stop offset="1" stop-color="#e3e6e9"/>
  </linearGradient>
  <linearGradient id="knobBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fd0ff"/>
    <stop offset="0.5" stop-color="#2c8ce0"/>
    <stop offset="1" stop-color="#145a9c"/>
  </linearGradient>
</defs>
<g transform="translate(28.2 4.4) scale(0.78)">
<g filter="url(#c-lift)">
  <rect x="52" y="44" width="152" height="176" rx="14" fill="url(#plate)" stroke="#3d4248" stroke-width="3"/>
  <rect x="58" y="50" width="140" height="164" rx="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- Tick marks along each slot. -->
  <g stroke="#565c62" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M74 76H82M74 100H82M74 124H82M74 148H82M74 172H82M74 196H82"/>
    <path d="M114 76H122M114 100H122M114 124H122M114 148H122M114 172H122M114 196H122"/>
    <path d="M154 76H162M154 100H162M154 124H162M154 148H162M154 172H162M154 196H162"/>
  </g>
  <!-- The slots. -->
  <rect x="91" y="68" width="8" height="136" rx="4" fill="url(#slot)"/>
  <rect x="131" y="68" width="8" height="136" rx="4" fill="url(#slot)"/>
  <rect x="171" y="68" width="8" height="136" rx="4" fill="url(#slot)" transform="translate(-4 0)"/>
  <!-- The knobs: low, high, middle (the middle one lit). -->
  <rect x="79" y="150" width="32" height="20" rx="5" fill="url(#knob)" stroke="#33383d" stroke-width="2.5"/>
  <path d="M83 160H107" stroke="#33383d" stroke-width="2" opacity="0.6"/>
  <rect x="119" y="84" width="32" height="20" rx="5" fill="url(#knobBlue)" stroke="#0d3a66" stroke-width="2.5"/>
  <path d="M123 94H147" stroke="#0d3a66" stroke-width="2" opacity="0.6"/>
  <rect x="155" y="118" width="32" height="20" rx="5" fill="url(#knob)" stroke="#33383d" stroke-width="2.5"/>
  <path d="M159 128H183" stroke="#33383d" stroke-width="2" opacity="0.6"/>
</g>
</g>
</svg>
