name: shell

# Pull requests, and pushes to main. A branch with a PR is tested once, by
# the PR's run; a push run on top would test the same commit again.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch or PR cancels its older runs, which would only
# report on code already replaced (many pushes queue up behind each other).
# Every commit on main still runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Qt 6.8.1, the release a device's webOS OSE image ships (meta-qt6,
      # scarthgap), as scripts/linux-setup.sh installs it; Ubuntu's own Qt
      # packages stop at 6.4. The action also installs the system
      # libraries Qt loads, and caches Qt between runs.
      - name: Install Qt 6.8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtshadertools
          cache: true

      - name: Build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0 libnss3 libxkbfile1 \
            xvfb xauth libgl1-mesa-dri fonts-dejavu-core \
            pkg-config libglib2.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/package-lock.json
            apps/enact-notes-limestone/package-lock.json
            apps/enact-notes-agate/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Radicale and WsgiDAV (CardDAV / CalDAV and WebDAV servers for the DAV sync and backup tests)
        run: python3 -m pip install radicale wsgidav cheroot

      # The Marketplace's catalog service (server/marketplace): PHP 8 with
      # libsodium and SQLite. The web apps' tests use it too (the
      # Marketplace's device service against the real server).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, pdo_mysql, zlib
          coverage: none

      - name: Marketplace catalog service (PHP) - tests
        run: php server/marketplace/tests/run.php

      - name: Update feed publisher (server/updates)
        run: php server/updates/tests/run.php

      - name: Web apps (React + TypeScript) - typecheck, unit tests, build
        working-directory: apps
        run: |
          # Every platform's native packages in the lock, or npm ci fails on Macs.
          node ../tools/check-lockfile.cjs
          npm ci
          npm run typecheck
          npm test
          npm run build
          # The device services (Node.js, not bundled): syntax only. The DAV
          # service's own tests ran above (vitest, against Radicale).
          for f in files/service/*.js voicememos/service/*.js dav/service/*.js dav/service/lib/*.js \
                   settings/service/*.js settings/service/lib/*.js marketplace/service/*.js marketplace/service/lib/*.js \
                   ../services/updates/*.js ../services/updates/lib/*.js; do node --check "$f"; done

      # The Enact demos are npm projects of their own (apps/enact-notes-*/
      # README.md); `npm ci` copies in @phoenix/notes-core as built above.
      - name: Enact demo apps - typecheck, build
        working-directory: apps
        run: |
          for app in enact-notes-limestone enact-notes-agate; do
            node ../tools/check-lockfile.cjs $app/package-lock.json
            (cd $app && npm ci --no-audit --no-fund && npm run typecheck && npm run build)
          done

      # The Flutter demo (apps/flutter-notes/README.md): the Flutter release
      # its pubspec.lock was resolved with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Flutter demo app - analyze, unit tests, build
        working-directory: apps/flutter-notes
        run: |
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos
          flutter test
          tool/build.sh

      - name: Build simulator
        run: |
          # The apps were built above; skip the CMake npm step.
          cmake -S shell -B build -DCMAKE_BUILD_TYPE=Release -DPHOENIX_BUILD_APPS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j

      - name: Behaviour tests
        # Failures also become annotations, readable without the log.
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests 2>&1 \
            | tee qml-tests.log

      - name: Report failed behaviour tests
        if: failure()
        run: |
          grep -A2 -E '^(FAIL!|XPASS)' qml-tests.log | head -10 | while IFS= read -r line; do
            echo "::error title=QML test::$line"
          done || true

      # A device pixel ratio of 2 (a Retina Mac): Qt then loads name@2x.png
      # for name.png by itself, which must not change the art's size, and
      # app icons come from the file that covers 2 pixels per point.
      - name: HiDPI art at a device pixel ratio of 2
        run: QT_SCALE_FACTOR=2 QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests/tst_hidpi.qml

      - name: Terminal PTY service (core and Luna methods, services/pty)
        # A native test that hangs fails here, with its log, not after the job's limit.
        timeout-minutes: 10
        run: build/pty/pty-test

      - name: Device services (display, keys, vibrator, light sensor; services/devices)
        timeout-minutes: 10
        run: build/devices/devices-test

      - name: The simulator's installed apps (SimInstaller)
        timeout-minutes: 10
        run: build/siminstaller-test

      - name: The colour emoji font's fontconfig setup (SimFonts)
        timeout-minutes: 10
        run: build/simfonts-test

      - name: The keyboard's dictation (recording format, transcriber replies)
        timeout-minutes: 10
        run: build/dictation-test

      - name: The wake word ("Hey Phoenix" in the test recordings, with Vosk's model)
        timeout-minutes: 10
        run: python3 tools/get-wakeword.py && build/wakeword-test

      - name: The simulator's network (content blocker, user agents, DropShare's server)
        timeout-minutes: 10
        run: build/simnet-test

      - name: The simulator's Marketplace catalog service (started, stopped, failing)
        timeout-minutes: 10
        run: build/simmarketplace-test

      - name: The Assistant's on-device model runner and speech
        timeout-minutes: 10
        run: build/localmodels-test

      - name: Trademark overlays up to date
        run: python3 tools/debrand-overlays.py --check

      - name: HiDPI art present and true to its 1x art
        run: |
          python3 -m pip install pillow numpy
          python3 tools/hidpi-art.py --check
          python3 tools/keyboard-charcoal.py --check

      - name: App icons match their SVG sources; the originals' 512 px icons are present
        run: |
          node tools/render-app-icons.cjs --check
          python3 tools/upscale-app-icons.py --check

      - name: Feedback sounds match their generator
        run: python3 tools/make-feedback-sounds.py --check

      - name: The Assistant's bird matches its source (art/assistant-bird/bird.json)
        run: python3 tools/gen-assistant-bird.py --check

      - name: Web app tests (original webOS apps in headless Chromium)
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
          export NODE_PATH="$(npm root -g)"
          # A failing test's command and its last lines become annotations,
          # readable without the log.
          t() {
            "$@" 2>&1 | tee web-test.log
            local status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error title=Web test failed::$*"
              { grep -E '^(FAIL|not ok|Error)' web-test.log; tail -4 web-test.log; } | head -9 \
                | while IFS= read -r line; do echo "::error title=Web test output::$line"; done
              exit "$status"
            fi
          }
          t node tools/test-apps.cjs --out app-tests/phone
          t node tools/test-apps.cjs --tablet --out app-tests/tablet
          t node tools/test-hidpi.cjs
          t node tools/test-settings.cjs --out app-tests/settings-phone
          t node tools/test-settings.cjs --tablet --out app-tests/settings-tablet
          t node tools/test-backup.cjs --out app-tests/backup-phone
          t node tools/test-backup.cjs --tablet --out app-tests/backup-tablet
          t node tools/test-marketplace.cjs --out app-tests/marketplace-phone
          t node tools/test-marketplace.cjs --tablet --out app-tests/marketplace-tablet
          t node tools/test-appmanager.cjs
          t node tools/test-updates.cjs --out app-tests/updates-phone
          t node tools/test-updates.cjs --tablet --out app-tests/updates-tablet
          t node tools/test-phone-messaging.cjs --out app-tests/phone-messaging-phone
          t node tools/test-phone-messaging.cjs --tablet --out app-tests/phone-messaging-tablet
          t node tools/test-media.cjs --out app-tests/media-phone
          t node tools/test-media.cjs --tablet --out app-tests/media-tablet
          t node tools/test-justtype.cjs --out app-tests/justtype-phone
          t node tools/test-justtype.cjs --tablet --out app-tests/justtype-tablet
          t node tools/test-browser.cjs --out app-tests/browser-phone
          t node tools/test-browser.cjs --tablet --out app-tests/browser-tablet
          t node tools/test-links.cjs --out app-tests/links-phone
          t node tools/test-files.cjs --out app-tests/files-phone
          t node tools/test-files.cjs --tablet --out app-tests/files-tablet
          t node tools/test-tasks.cjs --out app-tests/tasks-phone
          t node tools/test-tasks.cjs --tablet --out app-tests/tasks-tablet
          t node tools/test-db8-pages.cjs --out app-tests/db8-pages
          t node tools/test-alarm.cjs --out app-tests/alarm
          t node tools/test-voicememos.cjs --out app-tests/voicememos-phone
          t node tools/test-voicememos.cjs --tablet --out app-tests/voicememos-tablet
          t node tools/test-flashlight.cjs --out app-tests/flashlight-phone
          t node tools/test-flashlight.cjs --tablet --out app-tests/flashlight-tablet
          t node tools/test-screenshot.cjs --out app-tests/screenshot-phone
          t node tools/test-screenshot.cjs --tablet --out app-tests/screenshot-tablet
          t node tools/test-notificationlab.cjs --out app-tests/notificationlab-phone
          t node tools/test-notificationlab.cjs --tablet --out app-tests/notificationlab-tablet
          t node tools/test-scanner.cjs --out app-tests/scanner-phone
          t node tools/test-scanner.cjs --tablet --out app-tests/scanner-tablet
          t node tools/test-weather.cjs --out app-tests/weather-phone
          t node tools/test-weather.cjs --tablet --out app-tests/weather-tablet
          t node tools/test-maps.cjs --out app-tests/maps-phone
          t node tools/test-maps.cjs --tablet --out app-tests/maps-tablet
          t node tools/test-passwords.cjs --out app-tests/passwords-phone
          t node tools/test-passwords.cjs --tablet --out app-tests/passwords-tablet
          t node tools/test-authenticator.cjs --out app-tests/authenticator-phone
          t node tools/test-authenticator.cjs --tablet --out app-tests/authenticator-tablet
          t node tools/test-clipboard.cjs --out app-tests/clipboard-phone
          t node tools/test-clipboard.cjs --tablet --out app-tests/clipboard-tablet
          t node tools/test-community.cjs --out app-tests/community-phone
          t node tools/test-community.cjs --tablet --out app-tests/community-tablet
          t node tools/test-sharing.cjs --out app-tests/sharing-phone
          t node tools/test-sharing.cjs --tablet --out app-tests/sharing-tablet
          t node tools/test-assistant.cjs --out app-tests/assistant-phone
          t node tools/test-assistant.cjs --tablet --out app-tests/assistant-tablet
          t node tools/test-terminal.cjs --out app-tests/terminal-phone
          t node tools/test-terminal.cjs --tablet --out app-tests/terminal-tablet
          t node tools/test-videos.cjs --out app-tests/videos-phone
          t node tools/test-videos.cjs --tablet --out app-tests/videos-tablet
          t node tools/test-podcasts.cjs --out app-tests/podcasts-phone
          t node tools/test-podcasts.cjs --tablet --out app-tests/podcasts-tablet
          t node tools/test-docs.cjs --out app-tests/docs-phone
          t node tools/test-docs.cjs --tablet --out app-tests/docs-tablet
          t node tools/test-dav-sync.cjs --out app-tests/dav-phone
          t node tools/test-dav-sync.cjs --tablet --out app-tests/dav-tablet
          t node tools/test-orientation.cjs --out app-tests/orientation-phone
          t node tools/test-orientation.cjs --tablet --out app-tests/orientation-tablet
          t node tools/test-keyboard.cjs --out app-tests/keyboard-phone
          t node tools/test-keyboard.cjs --tablet --out app-tests/keyboard-tablet
          t node tools/test-editing.cjs --out app-tests/editing-phone
          t node tools/test-editing.cjs --tablet --out app-tests/editing-tablet
          t node tools/test-firstuse.cjs --out app-tests/firstuse-phone
          t node tools/test-firstuse.cjs --tablet --out app-tests/firstuse-tablet
          t node tools/test-help.cjs --out app-tests/help-phone
          t node tools/test-help.cjs --tablet --out app-tests/help-tablet
          t node tools/test-emergency.cjs --out app-tests/emergency-phone
          t node tools/test-emergency.cjs --tablet --out app-tests/emergency-tablet
          t node tools/test-location.cjs --out app-tests/location-phone
          t node tools/test-location.cjs --tablet --out app-tests/location-tablet
          t node tools/test-enact-notes.cjs --out app-tests/enact-notes
          t node tools/test-ionic-notes.cjs --out app-tests/ionic-notes
          t node tools/test-flutter-notes.cjs --out app-tests/flutter-notes

      # The menus over the screen, with the keyboard focus on the screen.
      - name: The simulator's menu bar
        run: xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --check-chrome --no-boot-animation --quiet

      - name: Screenshots
        run: |
          mkdir -p screenshots/phone screenshots/tablet
          for s in locked cards stacks reorder maximized launcher launcheredit lowbattery banner notified dashboard drawer justtype keyboard systemmenu pin emergency firstuse; do
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --scene $s --screenshot screenshots/phone/$s.png
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --tablet --scene $s --screenshot screenshots/tablet/$s.png
          done
          # Turned: the phone on its side, the TouchPad upright.
          mkdir -p screenshots/phone-landscape screenshots/tablet-portrait
          for s in locked cards heldcard maximized launcher dashboard keyboard; do
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --scene $s --orientation left --screenshot screenshots/phone-landscape/$s.png
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --tablet --scene $s --orientation right --screenshot screenshots/tablet-portrait/$s.png
          done

      # Also when a step fails: the app tests' screenshots show what went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots
            app-tests

      # ./phoenix, the one command, in its dry run on a pretend Linux and
      # Mac (what it finds, would install and would run). Independent of the
      # build: it runs even when a step before it failed, and last,
      # so it hides no other test's result and none hides its own.
      - name: The one command (./phoenix)
        if: ${{ !cancelled() }}
        run: sh tools/test-phoenix-script.sh

  # The simulator on a Mac (Apple silicon), built the way
  # docs/GETTING-STARTED.md and scripts/mac-setup.sh build it: Homebrew's Qt,
  # Apple's compiler and macOS's headers, with the apps built by CMake's npm
  # step. The Linux job above can't catch code that only builds on Linux.

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Qt 6, CMake and Ninja (Homebrew)
        run: brew install qt cmake ninja

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/package-lock.json
            apps/enact-notes-limestone/package-lock.json
            apps/enact-notes-agate/package-lock.json

      - name: Build simulator and apps
        run: |
          cmake -S shell -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build

      # What the shell's MemoryMonitor reads on a Mac (a launch is refused
      # when under 5 % is available): the figures, should a test find
      # memory low.
      - name: Memory
        run: |
          sysctl hw.memsize kern.memorystatus_level
          vm_stat

      # Qt Quick's software renderer, as the Linux job gets with the
      # offscreen platform: its animations move on with the clock. Offscreen
      # on a Mac otherwise renders with Metal, whose animations move on only
      # as frames are drawn, and without a screen it draws a few a second,
      # so every timed check would wait on that. These tests are of the
      # shell's behaviour; the start-up step below runs the simulator with
      # the Mac's own renderer.
      # The tests run as a background process, whose timers macOS defers
      # (App Nap): a 50 ms key repeat could fire 150 ms late.
      - name: No App Nap for the tests
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES

      - name: Behaviour tests
        env:
          QT_QUICK_BACKEND: software
        # Failures also become annotations, readable without the log.
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen "$(brew --prefix qt)/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests 2>&1 \
            | tee qml-tests.log

      - name: Report failed behaviour tests
        if: failure()
        run: |
          grep -A2 -E '^(FAIL!|XPASS)' qml-tests.log | head -10 | while IFS= read -r line; do
            echo "::error title=QML test::$line"
          done || true

      - name: Terminal PTY service, installed apps, dictation
        # A native test that hangs fails here, with its log, not after the job's limit.
        timeout-minutes: 10
        run: |
          build/pty/pty-test
          build/siminstaller-test
          build/dictation-test
          python3 tools/get-wakeword.py && build/wakeword-test
          build/localmodels-test
          build/simnet-test
          build/simmarketplace-test

      - name: The simulator starts (phone and tablet)
        run: |
          mkdir -p screenshots-macos
          build/phoenix-sim --scene cards --screenshot screenshots-macos/phone.png
          build/phoenix-sim --tablet --scene cards --screenshot screenshots-macos/tablet.png
          test -s screenshots-macos/phone.png && test -s screenshots-macos/tablet.png

      # The menu bar at the top of the screen has the simulator's menus
      # while the keyboard focus is on the device's screen (a window inside
      # the simulator's: SimChrome's constructor), and the program is a
      # foreground app (AppKit's NSApp.mainMenu and activationPolicy).
      - name: The simulator's menu bar (macOS's, at the top of the screen)
        run: build/phoenix-sim --check-chrome --no-boot-animation --quiet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: screenshots-macos

      # ./phoenix's dry runs with macOS's own sh, sed and grep; last, as
      # in the Linux job.
      - name: The one command (./phoenix) with macOS's own tools
        if: ${{ !cancelled() }}
        run: sh tools/test-phoenix-script.sh
