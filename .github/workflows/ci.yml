name: shell

# Pull requests, and pushes to main. A branch with a PR is tested once, by
# the PR's run; a push run on top would test the same commit again.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch or PR cancels its older runs, which would only
# report on code already replaced (many pushes queue up behind each other).
# Every commit on main still runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# On Linux the tests run as jobs side by side, each set up by
# .github/actions/setup, and "test" passes when they all have:
#
#   checks      tools/ci-checks.sh (./phoenix test --quick): every check that
#               needs no build, about 6 minutes, so a slip shows early
#   apps        the apps built (React, Enact, Flutter): for the jobs below
#               (apps-built) and for an image (apps-dist); the Enact, Dart and
#               Flutter checks; the device-readiness checkers over them
#   behaviour   the simulator built; the QML behaviour tests (the longest
#               job, about 20 minutes)
#   web         the web app tests in headless Chromium, in four shards
#               (tools/run-web-tests.cjs, the list in tools/web-tests.txt)
#   simulator   the simulator built with the apps: the C++ tests, then the
#               simulator run (its menu bar, the user agent, two at once,
#               activities, the Sign In card, the Assistant on Synergy,
#               Search your phone, the screenshots)
#   test        all of the above passed
#
# The device's Qt (qt-6-8) and the Mac (macos) have jobs of their own.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ffmpeg: the feedback tones (MP3) are checked by decoding them.
      # rsync: the Mac's image build copies the checkout with it
      # (tools/test-mac-build.py).
      - uses: ./.github/actions/setup
        with:
          apt: ffmpeg rsync

      # Each check's result and time is in its summary at the end; a failed
      # one is also an annotation.
      - name: The quick checks (tools/ci-checks.sh)
        run: sh tools/ci-checks.sh

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      # The typecheck and unit tests are the checks job's.
      - name: Web apps (React + TypeScript) - build
        working-directory: apps
        run: npm run build

      # What a device image would trip on that the simulator hides
      # (docs/PRE-IMAGE-CHECKLIST.md): Luna calls against their providers
      # and ACG groups, simulator-only references, the image's contents
      # against its recipes, the recipes themselves, licences; and the
      # checkers' own tests, which run them over this checkout too; and what
      # install-rootfs.py puts in an image (each bus service's files and the
      # code it runs, db8 kinds, activities: test-install-rootfs.py). After
      # the apps' build, so install-rootfs.py's plan has every app. A
      # finding not in tools/check-device-allowlist.json fails.
      - name: Device readiness checkers
        run: |
          python3 tools/test-devicecheck.py
          python3 tools/test-install-rootfs.py
          tools/check-device.sh

      # The Enact demos are npm projects of their own (apps/enact-notes-*/
      # README.md); `npm ci` copies in @phoenix/notes-core as built above.
      # Their lockfiles are checked in the checks job.
      - name: Enact demo apps - typecheck, build
        working-directory: apps
        run: |
          for app in enact-notes-limestone enact-notes-agate; do
            (cd $app && npm ci --no-audit --no-fund && npm run typecheck && npm run build)
          done

      # The Flutter demo (apps/flutter-notes/README.md): the Flutter release
      # its pubspec.lock was resolved with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # The Phoenix service plugin for Dart, which the Flutter demo uses.
      - name: Dart package phoenix_services - analyze, unit tests
        working-directory: apps/shared/phoenix_services
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: Flutter demo app - analyze, unit tests, build
        working-directory: apps/flutter-notes
        run: |
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos
          flutter test
          tool/build.sh

      # The built apps (React, Enact, Flutter; the shared packages' lib/)
      # for a device image: meta-phoenix's phoenix-apps installs them from
      # this archive (PHOENIX_APPS_DIST), as BitBake allows no npm in
      # do_compile (tools/pack-apps-dist.sh, docs/PRE-IMAGE-CHECKLIST.md B3).
      - name: Pack the built apps for the image
        run: tools/pack-apps-dist.sh apps-dist.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: apps-dist
          path: apps-dist.tar.gz
          retention-days: 30

      # Everything the build wrote that the tests read, for the jobs that
      # need: every dist/ under apps/ (the apps, the Enact and Flutter
      # demos, the SDK's no-bundler build) and the shared packages' lib/.
      # Built once here rather than in each of them.
      - name: Pack the built apps for the test jobs
        run: |
          find apps -name node_modules -prune -o -type d \( -name dist -o -path 'apps/shared/*/lib' ! -path 'apps/shared/*/*/*' \) \
            -print -prune | sort > apps-built.txt
          tar -czf apps-built.tar.gz -T apps-built.txt
          echo "$(wc -l < apps-built.txt) folders, $(du -h apps-built.tar.gz | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: apps-built
          path: apps-built.tar.gz
          retention-days: 1
          # Already compressed.
          compression-level: 0

  behaviour:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          qt: 'true'

      # Without the apps: no QML test reads them (the qt-6-8 job runs the
      # same tests without them), so the CMake npm step is skipped. The C++
      # tests, some of which read them, are the simulator job's.
      - name: Build simulator
        run: |
          cmake -S shell -B build -DCMAKE_BUILD_TYPE=Release -DPHOENIX_BUILD_APPS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j

      - name: Behaviour tests
        # A test that waits forever (a QML file that fails to load) fails
        # here in minutes, with its log, instead of holding the job for hours.
        timeout-minutes: 40
        # Failures also become annotations, readable without the log.
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests 2>&1 \
            | tee qml-tests.log

      - name: Report failed behaviour tests
        if: failure()
        run: |
          grep -A2 -E '^(FAIL!|XPASS)' qml-tests.log | head -10 | while IFS= read -r line; do
            echo "::error title=QML test::$line"
          done || true

      # A device pixel ratio of 2 (a Retina Mac): Qt then loads name@2x.png
      # for name.png by itself, which must not change the art's size, and
      # app icons come from the file that covers 2 pixels per point.
      - name: HiDPI art at a device pixel ratio of 2
        run: QT_SCALE_FACTOR=2 QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests/tst_hidpi.qml

      - name: The device shell's Phoenix.Lsm types over fake luna-surfacemanager modules
        timeout-minutes: 10
        run: QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -import shell/tests-device/fakes -input shell/tests-device

  # The web app tests (original webOS apps and Phoenix's own in headless
  # Chromium), split into shards of about 12 minutes each by the tests'
  # weights in tools/web-tests.txt. tools/check-web-tests.cjs (in the checks
  # job) checks that these shards run every test in the list once. More
  # shards: the matrix and both /4s below.
  web:
    name: web ${{ matrix.shard }}/4
    needs: apps
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ffmpeg: the web tests ran with it in the one-job CI (the feedback
      # sounds' check installed it first); Voice Memos converts with it.
      - uses: ./.github/actions/setup
        with:
          apt: ffmpeg
          apps-built: 'true'
          playwright: 'true'

      # Each test's time is in the summary at the end (and on the job's
      # summary page); a failing test's command and its last lines become
      # annotations, readable without the log.
      - name: Web app tests (original webOS apps in headless Chromium)
        run: node tools/run-web-tests.cjs --shard ${{ matrix.shard }}/4

      # Also when a test fails: the screenshots show what went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-tests-${{ matrix.shard }}
          path: app-tests
          if-no-files-found: ignore

  simulator:
    needs: apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup
        with:
          qt: 'true'
          apps-built: 'true'

      # The apps were built by the apps job; skip the CMake npm step.
      - name: Build simulator
        run: |
          cmake -S shell -B build -DCMAKE_BUILD_TYPE=Release -DPHOENIX_BUILD_APPS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j

      # The C++ tests. Here rather than with the QML tests: some read the
      # built apps (siminstaller-test: the built-in apps' versions, the
      # SDK's dist/ the rootfs mounts).
      - name: Terminal PTY service (core and Luna methods, services/pty)
        # A native test that hangs fails here, with its log, not after the job's limit.
        timeout-minutes: 10
        run: build/pty/pty-test

      - name: Device services (display, keys, vibrator, light sensor, orientation; services/devices)
        timeout-minutes: 10
        run: build/devices/devices-test

      - name: The keyboard as the device's input method (Maliit plugin over a fake host; services/keyboard)
        timeout-minutes: 10
        run: QT_QPA_PLATFORM=offscreen build/keyboard/keyboard-test

      # The plugin is built against a stand-in of Maliit's plugin API here
      # (services/keyboard/maliit-stub); this compiles it against the real
      # headers too, so the stand-in cannot drift from them.
      - name: The keyboard plugin against maliit-framework-webos's own headers
        timeout-minutes: 10
        run: |
          git clone -q --depth 1 https://github.com/webosose/maliit-framework-webos.git "$RUNNER_TEMP/maliit"
          cmake -S services/keyboard -B build-keyboard-realapi -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DPHOENIX_KEYBOARD_TESTS=OFF -DPHOENIX_MALIIT_SOURCE_DIR="$RUNNER_TEMP/maliit"
          cmake --build build-keyboard-realapi --target phoenix-keyboard-realapi -j

      - name: The simulator's installed apps (SimInstaller)
        timeout-minutes: 10
        run: build/siminstaller-test

      - name: The colour emoji font's fontconfig setup (SimFonts)
        timeout-minutes: 10
        run: build/simfonts-test

      - name: The simulator's --launch values (an app id, or appId:{json})
        timeout-minutes: 10
        run: build/simlaunch-test

      - name: The simulator's menu bar and its Window menu (SimChrome)
        timeout-minutes: 10
        run: QT_QPA_PLATFORM=offscreen build/simchrome-test

      - name: The simulators running at once, as Window > Simulators lists them (SimInstances)
        timeout-minutes: 10
        run: build/siminstances-test

      - name: The keyboard's dictation (recording format, transcriber replies)
        timeout-minutes: 10
        run: build/dictation-test

      - name: The wake word ("Hey Phoenix" in the test recordings, with Vosk's model)
        timeout-minutes: 10
        run: python3 tools/get-wakeword.py && build/wakeword-test

      - name: The simulator's network (content blocker, DropShare's server)
        timeout-minutes: 10
        run: build/simnet-test

      - name: The user agent and client hints every page is told (Chrome's version on its cadence)
        timeout-minutes: 10
        run: build/useragent-test

      - name: The simulator's Marketplace catalog service (started, stopped, failing)
        timeout-minutes: 10
        run: build/simmarketplace-test

      - name: The Assistant's on-device model runner and speech
        timeout-minutes: 10
        run: build/localmodels-test

      - name: Which renderers draw on the CPU, where the shell's blur steps down (RenderInfo)
        timeout-minutes: 10
        run: build/renderinfo-test

      - name: The Assistant's voice (phoenix-tts, with Kitten TTS's model and ONNX Runtime)
        timeout-minutes: 10
        run: python3 tools/get-kitten.py && build/tts-test

      # In the one-job CI the simulator's runs below came after ffmpeg (the
      # feedback sounds' check) and the system packages Playwright's
      # Chromium needs (the web tests'; fonts among them: CJK, Thai,
      # Unifont) were installed, and the C++ tests above before: the same here.
      - name: ffmpeg and Playwright's system packages
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install -g playwright@1
          playwright install-deps chromium

      # The menus over the screen, with the keyboard focus on the screen.
      - name: The simulator's menu bar
        run: xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --check-chrome --no-boot-animation --quiet

      # What sites are sent and pages read: the user agent and client
      # hints, in a web app's card and the browser, phone, tablet and a live
      # switch; the engine in Settings > Device Info.
      - name: The user agent in the simulator (a header-echo site)
        timeout-minutes: 15
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tools/test-useragent-sim.cjs --out app-tests/useragent-sim

      # Two simulators at once, each its own device (--instance).
      - name: Two simulators at once
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tools/test-instance-sim.cjs --out app-tests/instance-sim

      # The activity manager with each app a page of its own: an alarm rings
      # at its minute with the Clock closed, once; activities due together
      # each fire once; --launch 'appId:{json}'.
      - name: Activities and alarms in the simulator
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tools/test-activities-sim.cjs --out app-tests/activities-sim

      # A device's OAuth sign-in: the provider's page in the Sign In card,
      # under the shell's bar; Allow, and the card closed (CANCELED).
      - name: The Sign In card in the simulator
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tools/test-signin-card-sim.cjs --out app-tests/signin-card-sim

      # The Assistant on accounts connected through Synergy: the real
      # Todoist, Bluesky and Jabber connectors against their stand-ins and
      # the simulator's demo server.
      - name: The Assistant on Synergy accounts in the simulator
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1920x1200x24" node tools/test-assistant-synergy-sim.cjs --out app-tests/assistant-synergy-sim

      # Search your phone (services/index): EmbeddingGemma 2 (310 MB) and
      # llama.cpp's llama-server, fetched by tools/get-index-model.py into
      # build/index and kept between runs; the simulator's data indexed,
      # then found by what it means by the Assistant and Just Type.
      - name: Search your phone's model and llama-server (kept between runs)
        uses: actions/cache@v4
        with:
          path: build/index
          key: index-model-${{ hashFiles('tools/get-index-model.py', 'services/index/lib/model.js') }}
      - name: Search your phone in the simulator (EmbeddingGemma 2 through llama-server)
        timeout-minutes: 20
        run: |
          python3 tools/get-index-model.py
          xvfb-run -a -s "-screen 0 1920x1200x24" node tools/test-index-sim.cjs --out app-tests/index-sim

      - name: Screenshots
        run: |
          mkdir -p screenshots/phone screenshots/tablet
          for s in locked cards stacks reorder maximized launcher launcheredit lowbattery banner notified dashboard drawer justtype keyboard systemmenu pin emergency firstuse; do
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --scene $s --screenshot screenshots/phone/$s.png
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --tablet --scene $s --screenshot screenshots/tablet/$s.png
          done
          # Turned: the phone on its side, the TouchPad upright.
          mkdir -p screenshots/phone-landscape screenshots/tablet-portrait
          for s in locked cards heldcard maximized launcher dashboard keyboard; do
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --scene $s --orientation left --screenshot screenshots/phone-landscape/$s.png
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --tablet --scene $s --orientation right --screenshot screenshots/tablet-portrait/$s.png
          done

      # Also when a step fails: the simulator tests' screenshots show what
      # went wrong. (The web tests' are in the app-tests-N artifacts.)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots
            app-tests

  # "test": every Linux job above passed (it was the one Linux job, and
  # this keeps its name for what it meant). A job skipped because one it
  # needs failed counts as failed.
  test:
    needs: [checks, apps, behaviour, web, simulator]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every Linux job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # The device's Qt (6.8.1: a webOS OSE image's, meta-qt6 scarthgap): the
  # shell's QML must keep running there while the simulator is on a newer
  # Qt. The simulator built with it, and the QML tests: the simulator's
  # and the device shell's (Phoenix.Lsm).
  qt-6-8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6.8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtshadertools
          cache: true

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0 libnss3 libxkbfile1 \
            xvfb xauth libgl1-mesa-dri fonts-dejavu-core pkg-config libglib2.0-dev

      - name: Build the simulator with Qt 6.8.1
        run: |
          cmake -S shell -B build -DCMAKE_BUILD_TYPE=Release -DPHOENIX_BUILD_APPS=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j

      - name: Behaviour tests on Qt 6.8.1
        timeout-minutes: 40
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests 2>&1 \
            | tee qml-tests.log

      - name: Report failed behaviour tests
        if: failure()
        run: |
          grep -A2 -E '^(FAIL!|XPASS)' qml-tests.log | head -10 | while IFS= read -r line; do
            echo "::error title=QML test (Qt 6.8.1)::$line"
          done || true

      - name: The device shell's Phoenix.Lsm types on Qt 6.8.1
        timeout-minutes: 10
        run: QT_QPA_PLATFORM=offscreen "$QT_ROOT_DIR/bin/qmltestrunner" -import shell/qml -import build/qml -import shell/tests-device/fakes -input shell/tests-device

      - name: The user agent policy on Qt 6.8.1
        timeout-minutes: 10
        run: build/useragent-test

  # The simulator on a Mac (Apple silicon), built the way
  # docs/GETTING-STARTED.md and scripts/mac-setup.sh build it: Homebrew's Qt
  # (qt 6.12.0, whose qtwebengine formula is 6.11.2: Chromium 140 with
  # security fixes to 151, behind the Linux job's 6.11.3),
  # Apple's compiler and macOS's headers, with the apps built by CMake's npm
  # step. The Linux jobs above can't catch code that only builds on Linux.

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Qt 6, CMake and Ninja (Homebrew)
        # onnxruntime: the Assistant's voice (tts-test, with Kitten TTS's model).
        run: brew install qt cmake ninja onnxruntime

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/package-lock.json
            apps/enact-notes-limestone/package-lock.json
            apps/enact-notes-agate/package-lock.json

      - name: Build simulator and apps
        run: |
          cmake -S shell -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build

      # What the shell's MemoryMonitor reads on a Mac (a launch is refused
      # when under 5 % is available): the figures, should a test find
      # memory low.
      - name: Memory
        run: |
          sysctl hw.memsize kern.memorystatus_level
          vm_stat

      # Qt Quick's software renderer, as the Linux jobs get with the
      # offscreen platform: its animations move on with the clock. Offscreen
      # on a Mac otherwise renders with Metal, whose animations move on only
      # as frames are drawn, and without a screen it draws a few a second,
      # so every timed check would wait on that. These tests are of the
      # shell's behaviour; the start-up step below runs the simulator with
      # the Mac's own renderer.
      # The tests run as a background process, whose timers macOS defers
      # (App Nap): a 50 ms key repeat could fire 150 ms late.
      - name: No App Nap for the tests
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES

      - name: Behaviour tests
        timeout-minutes: 60
        env:
          QT_QUICK_BACKEND: software
        # Failures also become annotations, readable without the log.
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen "$(brew --prefix qt)/bin/qmltestrunner" -import shell/qml -import build/qml -input shell/tests 2>&1 \
            | tee qml-tests.log

      - name: Report failed behaviour tests
        if: failure()
        run: |
          grep -A2 -E '^(FAIL!|XPASS)' qml-tests.log | head -10 | while IFS= read -r line; do
            echo "::error title=QML test::$line"
          done || true

      - name: Terminal PTY service, installed apps, dictation
        # A native test that hangs fails here, with its log, not after the job's limit.
        timeout-minutes: 10
        run: |
          build/pty/pty-test
          build/siminstaller-test
          build/simlaunch-test
          QT_QPA_PLATFORM=offscreen build/simchrome-test
          build/siminstances-test
          build/dictation-test
          python3 tools/get-wakeword.py && build/wakeword-test
          build/localmodels-test
          build/renderinfo-test
          python3 tools/get-kitten.py && build/tts-test
          build/simnet-test
          build/useragent-test
          build/simmarketplace-test

      - name: The simulator starts (phone and tablet)
        run: |
          mkdir -p screenshots-macos
          build/phoenix-sim --scene cards --screenshot screenshots-macos/phone.png
          build/phoenix-sim --tablet --scene cards --screenshot screenshots-macos/tablet.png
          test -s screenshots-macos/phone.png && test -s screenshots-macos/tablet.png

      # The menu bar at the top of the screen has the simulator's menus
      # while the keyboard focus is on the device's screen (a window inside
      # the simulator's: SimChrome's constructor), and the program is a
      # foreground app (AppKit's NSApp.mainMenu and activationPolicy).
      - name: The simulator's menu bar (macOS's, at the top of the screen)
        run: build/phoenix-sim --check-chrome --no-boot-animation --quiet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: screenshots-macos

      # ./phoenix's dry runs with macOS's own sh, sed and grep (Linux runs
      # them in its checks job); last, so they hide no other step's result.
      - name: The one command (./phoenix) with macOS's own tools
        if: ${{ !cancelled() }}
        run: sh tools/test-phoenix-script.sh
