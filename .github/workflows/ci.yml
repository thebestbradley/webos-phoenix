name: shell

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qttest qml6-module-qt5compat-graphicaleffects \
            qt6-webengine-dev qml6-module-qtwebengine qml6-module-qtwebchannel \
            xvfb xauth libgl1-mesa-dri fonts-dejavu-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Radicale (CardDAV / CalDAV server for the DAV sync tests)
        run: python3 -m pip install radicale

      - name: Web apps (React + TypeScript) - typecheck, unit tests, build
        working-directory: apps
        run: |
          # Every platform's native packages in the lock, or npm ci fails on Macs.
          node ../tools/check-lockfile.cjs
          npm ci
          npm run typecheck
          npm test
          npm run build
          # The device services (Node.js, not bundled): syntax only. The DAV
          # service's own tests ran above (vitest, against Radicale).
          for f in files/service/*.js voicememos/service/*.js dav/service/*.js dav/service/lib/*.js; do node --check "$f"; done

      - name: Build simulator
        run: |
          # The apps were built above; skip the CMake npm step.
          cmake -S shell -B build -DCMAKE_BUILD_TYPE=Release -DPHOENIX_BUILD_APPS=OFF
          cmake --build build -j

      - name: Behaviour tests
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import shell/qml -import build/qml -input shell/tests

      - name: Trademark overlays up to date
        run: python3 tools/debrand-overlays.py --check

      - name: HiDPI art present and true to its 1x art
        run: |
          python3 -m pip install pillow numpy
          python3 tools/hidpi-art.py --check

      - name: Web app tests (original webOS apps in headless Chromium)
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
          export NODE_PATH="$(npm root -g)"
          node tools/test-apps.cjs --out app-tests/phone
          node tools/test-apps.cjs --tablet --out app-tests/tablet
          node tools/test-settings.cjs --out app-tests/settings-phone
          node tools/test-settings.cjs --tablet --out app-tests/settings-tablet
          node tools/test-phone-messaging.cjs --out app-tests/phone-messaging-phone
          node tools/test-phone-messaging.cjs --tablet --out app-tests/phone-messaging-tablet
          node tools/test-media.cjs --out app-tests/media-phone
          node tools/test-media.cjs --tablet --out app-tests/media-tablet
          node tools/test-justtype.cjs --out app-tests/justtype-phone
          node tools/test-justtype.cjs --tablet --out app-tests/justtype-tablet
          node tools/test-browser.cjs --out app-tests/browser-phone
          node tools/test-browser.cjs --tablet --out app-tests/browser-tablet
          node tools/test-files.cjs --out app-tests/files-phone
          node tools/test-files.cjs --tablet --out app-tests/files-tablet
          node tools/test-tasks.cjs --out app-tests/tasks-phone
          node tools/test-tasks.cjs --tablet --out app-tests/tasks-tablet
          node tools/test-alarm.cjs --out app-tests/alarm
          node tools/test-voicememos.cjs --out app-tests/voicememos-phone
          node tools/test-voicememos.cjs --tablet --out app-tests/voicememos-tablet
          node tools/test-maps.cjs --out app-tests/maps-phone
          node tools/test-maps.cjs --tablet --out app-tests/maps-tablet
          node tools/test-dav-sync.cjs --out app-tests/dav-phone
          node tools/test-dav-sync.cjs --tablet --out app-tests/dav-tablet
          node tools/test-orientation.cjs --out app-tests/orientation-phone
          node tools/test-orientation.cjs --tablet --out app-tests/orientation-tablet
          node tools/test-keyboard.cjs --out app-tests/keyboard-phone
          node tools/test-keyboard.cjs --tablet --out app-tests/keyboard-tablet

      - name: Screenshots
        run: |
          mkdir -p screenshots/phone screenshots/tablet
          for s in locked cards stacks reorder maximized launcher launcheredit lowbattery banner notified dashboard justtype keyboard systemmenu; do
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --scene $s --screenshot screenshots/phone/$s.png
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --tablet --scene $s --screenshot screenshots/tablet/$s.png
          done
          # Turned: the phone on its side, the TouchPad upright.
          mkdir -p screenshots/phone-landscape screenshots/tablet-portrait
          for s in locked cards heldcard maximized launcher dashboard keyboard; do
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --scene $s --orientation left --screenshot screenshots/phone-landscape/$s.png
            xvfb-run -a -s "-screen 0 1920x1200x24" build/phoenix-sim --tablet --scene $s --orientation right --screenshot screenshots/tablet-portrait/$s.png
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            app-tests
