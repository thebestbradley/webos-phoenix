name: image parse

# The first row of the device CI matrix (docs/HARDWARE.md): parse every
# recipe and resolve webos-phoenix-image's whole task graph for each machine,
# without fetching sources or building anything. Uses about 500 MB of disk.

# Every PR. Pushes to main only when the layer or its setup changes; they
# also save the layer cache that PRs restore.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - meta-phoenix/**
      - scripts/setup-build.sh
      - scripts/parse-check.sh
      - .github/workflows/parse.yml

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        machine: [qemux86-64, raspberrypi4-64]
    steps:
      # HEAD's commit id is all the recipes need from the checkout; no
      # submodules.
      - uses: actions/checkout@v4

      # The host tools in OE's HOSTTOOLS that the runner lacks; the sanity
      # check stops bitbake without them.
      - name: Host tools for bitbake
        run: |
          echo "PHOENIX_PARSE_DIR=$RUNNER_TEMP/webos-phoenix-parse" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk diffstat chrpath cpio zstd lz4

      # build-webos and the layers it pins (about 200 MB), not sstate or
      # downloads: nothing is built. setup-build.sh holds the build-webos
      # pin, which pins every layer.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PHOENIX_PARSE_DIR }}
            !${{ env.PHOENIX_PARSE_DIR }}/BUILD
            !${{ env.PHOENIX_PARSE_DIR }}/cache
            !${{ env.PHOENIX_PARSE_DIR }}/downloads
            !${{ env.PHOENIX_PARSE_DIR }}/sstate-cache
            !${{ env.PHOENIX_PARSE_DIR }}/buildhistory
            !${{ env.PHOENIX_PARSE_DIR }}/parse-check-*.log
          key: webos-layers-${{ hashFiles('scripts/setup-build.sh') }}

      - name: Parse and resolve webos-phoenix-image (${{ matrix.machine }})
        run: scripts/parse-check.sh ${{ matrix.machine }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parse-check-${{ matrix.machine }}
          path: ${{ env.PHOENIX_PARSE_DIR }}/parse-check-*.log
