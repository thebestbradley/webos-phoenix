<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Copyright (c) 2026 webOS Phoenix contributors
     SPDX-License-Identifier: Apache-2.0

     Colour emoji right after the text font (GAPS V6): emoji in the shell's
     and the apps' text come from Noto Color Emoji, before any other font
     that happens to have them in black and white. "accept" places it after
     the family, so the text font keeps its own characters (the emoji font
     also has the digits, # and *, for keycaps).

     Prelude and Open Sans are fonts, so "same" (as strong as the family
     asked for) puts the emoji font first among their fallbacks. The generic
     families are names, not fonts: bound as strongly, the emoji font would
     be their best match, ahead of the fonts they stand for (DejaVu Sans
     ...), and text in the default font, sans-serif or monospace would get
     its bitmap digits. For them it is "weak": a fallback after their fonts
     (Qt 6.9 and Chromium take emoji from it anyway; simfonts-test).

     Installed in /etc/fonts/conf.d on a device; phoenix-sim includes it. -->
<fontconfig>
  <alias binding="same"><family>Prelude</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias binding="same"><family>Open Sans</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias binding="weak"><family>sans-serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias binding="weak"><family>serif</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias binding="weak"><family>monospace</family><accept><family>Noto Color Emoji</family></accept></alias>
</fontconfig>
